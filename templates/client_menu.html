{% extends "base.html" %}
{% block content %}
<section class="band compact-band">
  <div class="section-head"><h1>Más</h1><span class="pill">Cliente</span></div>
  <div class="grid menu-grid">
    {% for item in items %}
    <a class="card menu-card" href="{{ item.href }}"><span class="badge">{{ item.group }}</span><h3>{{ item.title }}</h3><p class="small">{{ item.body }}</p></a>
    {% endfor %}
  </div>
</section>
{% endblock %}
