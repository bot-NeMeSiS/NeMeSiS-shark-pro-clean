<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Match Flow V382</title><style>body{margin:0;background:#050b14;color:#fff;font-family:Inter,system-ui}.wrap{padding:18px;max-width:1100px;margin:auto}.card{background:#0b1728;border:1px solid rgba(255,255,255,.1);border-radius:18px;padding:16px;margin:12px 0}.ok{color:#61ffb2}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}.bar{height:10px;border-radius:20px;background:#18304d;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#00c2ff,#8fffce)}</style><link rel="stylesheet" href="/static/css/v482_premium_identity.css">
<link rel="stylesheet" href="/static/css/v485_crest_engine.css">
</head><body><main class="wrap"><h1>Admin · V382 Match Flow Control</h1><p class="ok">Sin gasto extra API · Persistencia SQLite · Preparado para ML histórico.</p><section id="readiness" class="grid"></section><section id="flows"></section></main><script>fetch('/api/v382/readiness').then(r=>r.json()).then(d=>{readiness.innerHTML=Object.entries(d.readiness).map(([k,v])=>`<div class="card"><b>${k}</b><h2>${v}</h2><div class="bar"><i style="width:${Math.min(v,100)}%"></i></div></div>`).join('')});fetch('/api/v382/match-flow-engine').then(r=>r.json()).then(d=>{flows.innerHTML=d.flows.map(f=>`<div class="card"><h3>${f.flow_state} · ${f.match_label}</h3><p>${f.admin_note}</p><small>${f.shark_signal}</small></div>`).join('')})</script></body></html>
