<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Live Radar V376</title><style>body{margin:0;background:#050914;color:#eef6ff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:1180px;margin:auto;padding:22px}.panel{border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.055);border-radius:22px;padding:18px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}.pill{display:inline-flex;border:1px solid rgba(120,220,255,.3);border-radius:999px;padding:6px 10px;color:#8de7ff;font-weight:800;font-size:12px}.ok{color:#79ffb2}.warn{color:#ffd166}.muted{color:#9fb3ca}pre{white-space:pre-wrap;word-break:break-word;background:rgba(0,0,0,.22);border-radius:14px;padding:12px}</style><link rel="stylesheet" href="/static/css/v482_premium_identity.css">
<link rel="stylesheet" href="/static/css/v485_crest_engine.css">
</head><body><main class="wrap"><div class="panel"><span class="pill">V376 · ADMIN OPS</span><h1>Live Radar Center</h1><p class="muted">Control operativo de momentum, estabilidad, caos y guardas del release móvil.</p></div><section class="grid" id="cards"></section><div class="panel"><h2>Release Guard</h2><pre id="guard">Cargando...</pre></div></main><script>Promise.all([fetch('/api/v376/momentum-radar?persist=1&limit=30').then(r=>r.json()),fetch('/api/v376/release-guard').then(r=>r.json())]).then(([radar,guard])=>{document.getElementById('cards').innerHTML=`<div class="panel"><b>Total señales</b><h2>${radar.total||0}</h2></div><div class="panel"><b>HOT controlado</b><h2>${(radar.counts||{})['HOT_CONTROLADO']||0}</h2></div><div class="panel"><b>Caótico</b><h2>${(radar.counts||{})['CAOTICO']||0}</h2></div><div class="panel"><b>Estado</b><h2 class="ok">READY</h2></div>`;document.getElementById('guard').textContent=JSON.stringify(guard,null,2)}).catch(e=>{document.getElementById('guard').textContent='Centro preparado. Error leyendo datos internos: '+e})</script></body></html>
