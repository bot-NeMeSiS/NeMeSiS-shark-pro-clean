<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Admin · V403 Live Center TOP</title><style>body{margin:0;background:#08111d;color:#edf6ff;font-family:Inter,system-ui,Arial}.wrap{max-width:1100px;margin:auto;padding:24px 16px}.panel{border:1px solid rgba(125,211,252,.22);border-radius:26px;padding:20px;background:rgba(15,23,42,.88)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-top:16px}.card{border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:15px;background:rgba(255,255,255,.055)}.tag{color:#7dd3fc;font-size:12px;text-transform:uppercase;letter-spacing:.12em}</style><link rel="stylesheet" href="/static/css/v482_premium_identity.css">
<link rel="stylesheet" href="/static/css/v485_crest_engine.css">
<link rel="stylesheet" href="/static/css/v490_performance_skeletons.css">
<link rel="stylesheet" href="/static/css/v491_final_design_system.css">
<link rel="stylesheet" href="/static/css/v492_live_score.css">
</head><body><main class="wrap"><section class="panel"><div class="tag">Admin V403</div><h1>Control Live Center TOP</h1><p>Organización LIVE para potencia sin saturación visual.</p></section><section class="grid">{% for m in data.modules %}<div class="card"><div class="tag">{{ m.module_key }}</div><h2>{{ m.title }}</h2><p>{{ m.description }}</p></div>{% endfor %}</section><section class="grid">{% for g in data.guardrails %}<div class="card"><div class="tag">{{ g.status }}</div><h3>{{ g.rule_name }}</h3><p>{{ g.expected_effect }}</p></div>{% endfor %}</section></main><script defer src="/static/js/v490_app_speed.js"></script>
</body></html>
