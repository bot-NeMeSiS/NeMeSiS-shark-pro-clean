<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Commercial Readiness V366</title>
<style>body{margin:0;background:#050b14;color:#eef7ff;font-family:Inter,system-ui,Arial;padding:22px}.wrap{max-width:1150px;margin:auto}.hero,.card{background:linear-gradient(145deg,rgba(15,31,55,.98),rgba(6,14,27,.98));border:1px solid rgba(66,198,255,.22);border-radius:24px;padding:20px;margin-bottom:14px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}.score{font-size:40px;font-weight:900;color:#6df0ff}.pill{display:inline-block;border-radius:999px;border:1px solid rgba(255,255,255,.18);padding:6px 10px;color:#aeeaff;font-size:12px}.muted{color:#9dafc4}button{border:0;border-radius:14px;padding:12px 16px;background:#31d7ff;color:#04111b;font-weight:900;cursor:pointer}</style><link rel="stylesheet" href="/static/css/v482_premium_identity.css">
</head><body><div class="wrap"><section class="hero"><span class="pill">V366 Admin</span><h1>Commercial Readiness Center</h1><p class="muted">Controla si NeMeSiS SHARK PRO está preparado para vender, publicar picks, ahorrar API y mostrar señales premium sin quemar datos malos.</p><button onclick="loadReady(true)">Recalcular y guardar informe</button></section><div id="top" class="grid"></div><div id="areas"></div></div><script>
async function loadReady(persist=false){const r=await fetch('/api/v366/readiness?persist='+(persist?'1':'0'));const d=await r.json();top.innerHTML=`<div class="card"><div class="muted">Nivel global producto</div><div class="score">${d.global_score||0}</div></div><div class="card"><div class="muted">ELITE ready</div><div class="score">${d.edge_summary?.elite_ready||0}</div></div><div class="card"><div class="muted">Publicables</div><div class="score">${d.edge_summary?.publicable||0}</div></div>`;areas.innerHTML=(d.areas||[]).map(a=>`<article class="card"><span class="pill">${a.priority}</span><span class="pill">${a.status}</span><h2>${a.area}</h2><div class="score">${a.score}</div><p class="muted">${a.note}</p></article>`).join('')}loadReady(false)</script></body></html>
