<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Control Center V380</title><style>body{margin:0;background:#050914;color:white;font-family:system-ui}.wrap{padding:24px;max-width:1150px;margin:auto}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}.card{background:linear-gradient(145deg,#081326,#0b1d36);border:1px solid #1b5d87;border-radius:22px;padding:18px;margin:12px 0;box-shadow:0 16px 38px #0008}.ok{color:#74ffbd}.warn{color:#ffe66d}.danger{color:#ff8a8a}.pill{display:inline-block;border:1px solid #2de2ff66;border-radius:999px;padding:6px 10px;margin:4px;background:#102944}code{color:#ffe66d}</style><link rel="stylesheet" href="/static/css/v482_premium_identity.css">
</head><body><div class="wrap"><h1>🛡️ Admin Control Center Pro V380</h1><p>Centro operativo para releases, móvil/PWA, Live, Memory, coste API y readiness comercial.</p><div id="out"></div></div><script>async function load(){let [a,b]=await Promise.all([fetch('/api/v380/admin-control-center').then(r=>r.json()),fetch('/api/v380/system-readiness').then(r=>r.json())]);out.innerHTML=`<div class="grid"><div class="card"><h2 class="ok">${a.global_score}</h2><p>Release QA Score</p></div><div class="card"><h2>${a.ops.length}</h2><p>Eventos Ops</p></div><div class="card"><h2>${a.checks.length}</h2><p>Checks release</p></div><div class="card"><h2 class="ok">OK</h2><p>Render/GitHub</p></div></div><h2>Operaciones</h2>${a.ops.map(x=>`<div class="card"><span class="pill">${x.area}</span><span class="pill">${x.status}</span><h3>${x.title}</h3><p>${x.detail}</p><b class="warn">${x.action}</b></div>`).join('')}<h2>Readiness</h2><div class="grid">${Object.entries(b.readiness).map(([k,v])=>`<div class="card"><h2>${(v/10).toFixed(1)}</h2><p>${k.replaceAll('_',' ')}</p></div>`).join('')}</div>`}load()</script></body></html>
