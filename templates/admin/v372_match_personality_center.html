<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin V372 Match Personality</title>
<style>body{margin:0;background:#080b14;color:#f5f7fb;font-family:Inter,Arial,sans-serif}.wrap{max-width:1240px;margin:auto;padding:24px}.hero,.card{background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.12);border-radius:22px;padding:20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;margin-top:16px}.pill{display:inline-block;border-radius:999px;padding:6px 10px;background:rgba(255,210,92,.14);border:1px solid rgba(255,210,92,.35);font-size:12px}.bar{height:8px;border-radius:8px;background:#1b2838;overflow:hidden}.bar i{display:block;height:100%;background:#28d7ff}.muted{color:#9aa8b8}</style><link rel="stylesheet" href="/static/css/v482_premium_identity.css">
<link rel="stylesheet" href="/static/css/v485_crest_engine.css">
</head>
<body><div class="wrap"><div class="hero"><span class="pill">ADMIN · V372</span><h1>Match Personality Center</h1><p class="muted">Centro táctico para auditar personalidad, caos, presión, riesgo trampa y prioridad comercial por partido.</p></div><div id="grid" class="grid"></div></div>
<script>
async function load(){const r=await fetch('/api/v372/match-personality?persist=1&limit=40');const d=await r.json();document.getElementById('grid').innerHTML=(d.items||[]).map(x=>`<div class="card"><span class="pill">${x.profile_type}</span><h3>${x.team_a} vs ${x.team_b}</h3><p class="muted">${x.admin_summary}</p>${['tempo_score','chaos_score','pressure_score','trap_risk','favorite_stability','live_reliability','commercial_priority'].map(k=>`<p>${k}: <b>${x[k]}</b></p><div class="bar"><i style="width:${x[k]}%"></i></div>`).join('')}</div>`).join('')||'<div class="card">Sin señales V372 todavía.</div>'}load();
</script></body></html>
