<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin V381 Live Context</title><style>body{margin:0;background:#050b14;color:white;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}.wrap{max-width:1100px;margin:0 auto;padding:22px 16px 96px}.panel{border:1px solid rgba(255,255,255,.14);border-radius:22px;padding:18px;background:rgba(255,255,255,.055);margin:12px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.kpi{font-size:34px;font-weight:900}.ok{color:#54ffbd}.warn{color:#ffd36e}.bad{color:#ff7b90}.muted{color:#aebbd0}.pill{border-radius:999px;border:1px solid rgba(82,211,255,.32);padding:6px 10px;color:#b9efff;background:rgba(82,211,255,.12);display:inline-flex;font-weight:800;font-size:12px}</style><link rel="stylesheet" href="/static/css/v482_premium_identity.css">

</head><body><main class="wrap"><section class="panel"><span class="pill">V381 ADMIN CONTROL</span><h1>SHARK Live Context Engine</h1><p class="muted">Control de estados live, rutas Push/PWA/Telegram, anti-spam y preparación ML sin activar gasto API adicional.</p></section><section id="readiness" class="grid"></section><section id="routes" class="panel"></section></main><script>Promise.all([fetch('/api/v381/live-readiness').then(r=>r.json()),fetch('/api/v381/live-context-engine').then(r=>r.json())]).then(([a,b])=>{readiness.innerHTML=Object.entries(a.readiness).map(([k,v])=>`<div class="panel"><div class="muted">${k}</div><div class="kpi ${v===0?'ok':v>95?'ok':'warn'}">${v}${v===0?'':'%'}</div></div>`).join('');routes.innerHTML='<h2>Rutas preparadas</h2>'+b.routes.map(r=>`<p><b>${r.membership}</b> · ${r.alert_type} · prioridad ${r.priority} · anti-spam ${r.anti_spam_seconds}s · estado ${r.status}</p>`).join('')})</script><script defer src="/static/js/v490_app_speed.js"></script>
