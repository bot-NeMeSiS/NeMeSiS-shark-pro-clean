<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Decision Factory V365</title><style>
body{margin:0;background:#050812;color:#edf6ff;font-family:Inter,system-ui,Segoe UI,Arial;padding:18px}.wrap{max-width:1220px;margin:auto}.hero,.card{background:linear-gradient(180deg,rgba(13,26,54,.94),rgba(8,13,28,.94));border:1px solid rgba(88,167,255,.22);border-radius:22px;padding:18px;margin-bottom:16px;box-shadow:0 20px 45px rgba(0,0,0,.35)}h1{margin:0}.muted{color:#9fb1c7}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}.btn{cursor:pointer;border:0;border-radius:14px;padding:10px 13px;background:#62c7ff;color:#03111e;font-weight:900}.row{padding:12px;border-bottom:1px solid rgba(255,255,255,.08)}.tag{display:inline-block;border-radius:999px;padding:5px 9px;background:rgba(255,255,255,.08);font-size:12px}.num{font-size:25px;font-weight:900}.PUBLICABLE{color:#4dffab}.REVISAR{color:#ffd36e}.ESPERAR{color:#ff8585}</style><link rel="stylesheet" href="/static/css/v482_premium_identity.css">
</head><body><div class="wrap">
<section class="hero"><span class="tag">Admin · V365</span><h1>SHARK Decision Factory</h1><p class="muted">Auditoría de picks, histórico, value index y persistencia para automatización real sin publicar basura.</p><button class="btn" onclick="runFactory()">Ejecutar fábrica y persistir</button> <button class="btn" onclick="runSignals()">Guardar señales históricas</button></section>
<section id="metrics" class="grid"></section><section class="card"><h2>Últimos picks generados</h2><div id="factory"></div></section><section class="card"><h2>Señales históricas</h2><div id="signals"></div></section>
</div><script>
async function dash(){const r=await fetch('/api/v365/decision-dashboard');const d=await r.json();document.getElementById('metrics').innerHTML=['shark_pick_factory','shark_history_signals','shark_decision_audit','pick_automation_queue','match_context_snapshots'].map(k=>`<div class="card"><div class="muted">${k}</div><div class="num">${d[k]||0}</div></div>`).join('');document.getElementById('factory').innerHTML=(d.latest_factory||[]).map(x=>`<div class="row"><b>${x.title||'Partido'}</b> <span class="tag ${x.decision}">${x.decision}</span><p class="muted">${x.league||''} · ${x.recommended_pick||''} · cuota ${x.odds_decimal||'-'} · score ${Number(x.shark_score||0).toFixed(0)} · value ${Number(x.value_index||0).toFixed(1)}</p><p>${x.reason||''}</p></div>`).join('')||'<p class="muted">Sin registros todavía.</p>';document.getElementById('signals').innerHTML=(d.latest_signals||[]).map(x=>`<div class="row"><b>${x.title}</b> <span class="tag">${x.signal_type}</span><p class="muted">Score ${Number(x.score||0).toFixed(1)} · tendencia ${x.trend||'-'} · muestra ${x.sample_size||0}</p></div>`).join('')||'<p class="muted">Sin señales guardadas.</p>';}
async function runFactory(){await fetch('/api/v365/pick-factory?persist=1&limit=20'); dash();}
async function runSignals(){await fetch('/api/v365/historical-signals?persist=1'); dash();}
dash();
</script></body></html>
