<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Memory Control V385</title><style>body{margin:0;background:#080d16;color:#f5fbff;font-family:Inter,system-ui,Arial}.wrap{max-width:1180px;margin:auto;padding:24px}.hero,.card{border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.055);border-radius:22px;padding:18px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}.kpi{font-size:34px;font-weight:950;color:#7ee8ff}.ok{color:#82ffba}.muted{color:#9db0c7}</style></head><body><main class="wrap"><section class="hero"><h1>Admin · SHARK Memory Control V385</h1><p class="muted">Auditoría de memoria real: perfiles, patrones, usuarios y preparación ML.</p><div class="grid" id="kpis"></div></section><section class="grid" id="details"></section></main><script>fetch('/api/v385/readiness').then(r=>r.json()).then(d=>{document.getElementById('kpis').innerHTML=Object.entries(d.readiness).map(([k,v])=>`<div class="card"><div class="kpi">${v}</div><b>${k}</b></div>`).join('');return fetch('/api/v385/shark-memory-real')}).then(r=>r.json()).then(d=>{document.getElementById('details').innerHTML=[...d.profiles,...d.patterns].map(x=>`<article class="card"><h3>${x.entity||x.pattern_key}</h3><p>${x.last_summary||x.shark_read}</p><p class="ok">${x.action_hint||x.risk_bias||''}</p></article>`).join('')})</script></body></html>
