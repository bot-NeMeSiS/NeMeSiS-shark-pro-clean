<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Admin V364 · Real Ops</title>
<style>body{margin:0;background:#050b16;color:#ecfeff;font-family:Inter,system-ui,Arial;padding:18px}.wrap{max-width:1180px;margin:auto}.hero{border-radius:24px;padding:22px;background:linear-gradient(135deg,#111827,#063142);border:1px solid rgba(34,211,238,.25)}h1{margin:0 0 8px}.muted{color:#94a3b8}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin:16px 0}.card,.row{background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.1);border-radius:18px;padding:15px}.num{font-size:28px;font-weight:900;color:#67e8f9}.btn{border:0;border-radius:13px;padding:11px 13px;background:#0f766e;color:white;font-weight:800;cursor:pointer;margin:4px}.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:850px){.cols{grid-template-columns:1fr}}</style><link rel="stylesheet" href="/static/css/v482_premium_identity.css">
<link rel="stylesheet" href="/static/css/v485_crest_engine.css">
</head><body><div class="wrap"><div class="hero"><h1>Admin Real Ops V364</h1><p class="muted">Panel para controlar calidad real, ahorro API, snapshots live y cola de automatización de picks.</p><button class="btn" onclick="refresh()">Actualizar panel</button><button class="btn" onclick="saveQuality()">Guardar control calidad</button><button class="btn" onclick="genQueue()">Generar cola SHARK</button><div class="grid" id="metrics"></div></div><div class="cols"><div><h2>Últimos controles de calidad</h2><div id="quality"></div></div><div><h2>Cola automatización</h2><div id="queue"></div></div></div></div><script>
async function j(u){const r=await fetch(u);return await r.json()}function card(k,v){return `<div class="card"><div class="muted">${k}</div><div class="num">${v}</div></div>`}
async function refresh(){const d=await j('/api/v364/api-saver-dashboard');document.getElementById('metrics').innerHTML=card('Cache API',d.api_cache)+card('Uso API logs',d.api_usage_logs)+card('Live snapshots',d.match_context_snapshots)+card('Quality events',d.data_quality_events)+card('Queue picks',d.pick_automation_queue);document.getElementById('quality').innerHTML=(d.latest_quality_events||[]).map(x=>`<div class="row"><b>${x.title}</b><p>${x.status} · ${x.quality_score}/100</p><p class="muted">${x.issues||'sin incidencias'} · ${x.created_at}</p></div>`).join('')||'<div class="row">Sin eventos todavía.</div>';document.getElementById('queue').innerHTML=(d.latest_queue||[]).map(x=>`<div class="row"><b>${x.title}</b><p>${x.suggested_pick}</p><p class="muted">SHARK ${x.shark_score}/100 · ${x.risk_label||''} · ${x.status}</p></div>`).join('')||'<div class="row">Cola vacía.</div>'}
async function saveQuality(){await j('/api/v364/data-quality?persist=1&limit=80');refresh()}async function genQueue(){await j('/api/v364/automation-candidates?persist=1&limit=20');refresh()}refresh();</script></body></html>
