<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin V388 Alert Router</title><style>body{margin:0;background:#080d16;color:#f3fbff;font-family:Inter,system-ui,Arial;padding:20px}.hero{border-radius:24px;padding:18px;background:linear-gradient(135deg,rgba(17,111,255,.22),rgba(255,200,0,.08));border:1px solid rgba(255,255,255,.12)}.grid{display:grid;gap:14px;margin-top:16px}.card{border:1px solid rgba(255,255,255,.12);border-radius:18px;padding:14px;background:rgba(255,255,255,.055)}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:rgba(0,210,255,.14);border:1px solid rgba(0,210,255,.28);font-size:12px;margin:2px}.muted{color:#a9bacb}</style><link rel="stylesheet" href="/static/css/v482_premium_identity.css">

</body></html>
