<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin · V368 Risk Center</title><style>body{margin:0;background:#050b16;color:#eef8ff;font-family:Inter,system-ui,Arial}.wrap{max-width:1180px;margin:0 auto;padding:24px}.panel{border:1px solid rgba(125,211,252,.20);background:linear-gradient(135deg,rgba(10,24,45,.98),rgba(4,9,18,.98));border-radius:24px;padding:22px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin-top:16px}.card{border:1px solid rgba(255,255,255,.10);background:rgba(255,255,255,.045);border-radius:18px;padding:15px}.num{font-size:30px;font-weight:900}.muted{color:#9eb3c7}.tag{font-size:12px;border:1px solid rgba(45,212,255,.25);background:rgba(45,212,255,.10);padding:5px 9px;border-radius:999px}.btn{border:0;border-radius:14px;padding:11px 14px;background:#38bdf8;color:#02101c;font-weight:900;cursor:pointer}</style></head><body><div class="wrap"><div class="panel"><span class="tag">V368 · Admin</span><h1>SHARK Risk Center</h1><p class="muted">Centro de control para bloquear trampas, medir presión de mercado y evitar sobreconfianza antes de publicar señales.</p><button class="btn" onclick="load()">Recalcular y guardar snapshot</button><div id="kpis" class="grid"></div><div id="items" class="grid"></div></div></div><script>async function load(){const r=await fetch('/api/v368/risk-center?persist=1');const d=await r.json();kpis.innerHTML=`<div class="card"><div class="muted">Estado global</div><div class="num">${d.global_status}</div></div><div class="card"><div class="muted">Carga riesgo</div><div class="num">${d.risk_load}/100</div></div><div class="card"><div class="muted">Presión media</div><div class="num">${d.avg_pressure}</div></div><div class="card"><div class="muted">Trampa media</div><div class="num">${d.avg_trap_risk}</div></div>`;items.innerHTML=(d.items||[]).map(x=>`<div class="card"><span class="tag">${x.priority_label} · ${x.final_risk_label}</span><h3>${x.title||'Partido'}</h3><p>${x.admin_note||''}</p><p class="muted">Acción: ${x.action_label}</p></div>`).join('')||'<p class="muted">Sin eventos.</p>'}load()</script></body></html>
