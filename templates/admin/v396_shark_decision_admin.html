<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin V396 Decision Engine</title><style>body{margin:0;background:#050b14;color:#f1f7ff;font-family:Inter,system-ui,Arial}.wrap{max-width:1180px;margin:auto;padding:22px}.panel{border:1px solid rgba(255,255,255,.12);border-radius:24px;padding:22px;background:linear-gradient(135deg,rgba(8,19,36,.98),rgba(20,30,50,.92))}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}.card{border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.05);border-radius:18px;padding:15px}.pill{display:inline-flex;border-radius:99px;padding:7px 10px;background:rgba(250,204,21,.14);color:#fde68a;font-weight:900;font-size:12px}.stat{font-size:30px;font-weight:950}</style><link rel="stylesheet" href="/static/css/v482_premium_identity.css">
<link rel="stylesheet" href="/static/css/v485_crest_engine.css">
</head><body><main class="wrap"><section class="panel"><span class="pill">ADMIN · V396</span><h1>SHARK Decision Engine Ops</h1><p>Control de decisiones, reglas y auditoría para publicación responsable.</p><div id="grid" class="grid"></div></section></main><script>fetch('/api/v396/shark-decision-engine').then(r=>r.json()).then(d=>{grid.innerHTML=[`<div class="card"><div class="stat">${d.totals.decision_readiness}%</div><p>Readiness decisión</p></div>`,`<div class="card"><div class="stat">${d.decisions.length}</div><p>Decisiones base</p></div>`,`<div class="card"><div class="stat">${d.rules.length}</div><p>Reglas activas</p></div>`].join('')+d.decisions.map(x=>`<article class="card"><span class="pill">${x.shark_action}</span><h3>${x.match_label}</h3><p>${x.admin_note}</p><small>Riesgo ${x.risk_score} · Value ${x.value_score}</small></article>`).join('')})</script></body></html>
