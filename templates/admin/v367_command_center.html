<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Command Center V367</title><style>body{margin:0;background:#060b14;color:#f1f7ff;font-family:Inter,system-ui;padding:22px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}.card{background:#0b1728;border:1px solid rgba(67,180,255,.22);border-radius:20px;padding:18px}.pill{display:inline-block;border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:6px 10px;margin:3px;color:#9edcff}.score{font-size:34px;font-weight:900}.muted{color:#9fb4c8}.good{color:#41f2a4}.warn{color:#ffd166}.bad{color:#ff6b6b}button{background:#145cff;color:white;border:0;border-radius:14px;padding:12px 16px;font-weight:900}</style><link rel="stylesheet" href="/static/css/v482_premium_identity.css">
<link rel="stylesheet" href="/static/css/v485_crest_engine.css">
</head><body><h1>Admin SHARK Command Center V367</h1><p class="muted">Centro de mando para decidir qué se publica, qué se revisa y qué se oculta antes de enviar a cliente, Push o Telegram.</p><button onclick="loadCmd(true)">Persistir análisis operativo</button><section id="top" class="grid"></section><h2>Acciones recomendadas</h2><section id="items" class="grid"></section><script>async function loadCmd(persist=false){const r=await fetch('/api/v367/command-center?persist='+(persist?'1':'0'));const d=await r.json();top.innerHTML=`<div class="card"><div class="muted">Potencia comercial</div><div class="score good">${d.commercial_power||0}</div></div><div class="card"><div class="muted">Filtro seguridad</div><div class="score">${d.safety_filter||0}</div></div><div class="card"><div class="muted">Automatización</div><div class="score warn">${d.automation_level||'preparación'}</div></div><div class="card"><div class="muted">Usables</div><div class="score">${d.summary?.usable_percent||0}%</div></div>`;items.innerHTML=(d.items||[]).map(x=>`<article class="card"><span class="pill">${x.exposure_level}</span><span class="pill">${x.publish_channel}</span><h3>${x.title||'Señal'}</h3><p class="muted">${x.league||''} · ${x.market||'1X2'} · ${x.pick||'Revisar'}</p><div class="score">${x.priority_score}</div><p class="${x.operator_status?.includes('AUTO')?'good':x.operator_status?.includes('NO')?'bad':'warn'}"><b>${x.admin_action}</b></p><p>${x.why_enter}</p><p class="muted">${x.risk_note}</p></article>`).join('')||'<div class="card">No hay acciones todavía.</div>'}</script></body></html>
