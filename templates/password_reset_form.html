{% extends "base.html" %}
{% block content %}
<section class="auth-shell compact-band">
  <article class="auth-card">
    <div class="kicker">{{ 'Admin' if admin else 'Cliente' }}</div>
    <h1>{{ ui("Nueva contraseña") }}</h1>
    {% if error %}
      <p class="notice">{{ error }}</p>
      <a class="btn" href="{{ '/admin-forgot-password' if admin else '/forgot-password' }}">{{ ui("Solicitar otro enlace") }}</a>
    {% else %}
      <p class="lead">{{ ui("Crea una contraseña segura para volver a entrar en NeMeSiS SHARK PRO.") }}</p>
      <form method="post" class="form-card">
        <div class="field"><label>{{ ui("Nueva contraseña") }}</label><input type="password" name="password" autocomplete="new-password" minlength="8" required></div>
        <button class="btn primary" type="submit">{{ ui("Guardar contraseña") }}</button>
      </form>
    {% endif %}
  </article>
</section>
{% endblock %}
