<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SHARK Live Decision Matrix</title><style>body{margin:0;background:#07111f;color:#eef6ff;font-family:Inter,Arial,sans-serif}.wrap{max-width:1180px;margin:0 auto;padding:24px}.hero{border:1px solid rgba(72,183,255,.25);background:linear-gradient(135deg,rgba(0,80,160,.35),rgba(2,8,20,.9));border-radius:26px;padding:24px;box-shadow:0 18px 55px rgba(0,0,0,.35)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-top:18px}.card{border:1px solid rgba(255,255,255,.11);background:rgba(255,255,255,.055);border-radius:22px;padding:16px}.tag{display:inline-flex;padding:6px 10px;border-radius:999px;background:rgba(70,190,255,.18);font-weight:800;font-size:12px}.muted{color:#a8b8ca}.num{font-size:28px;font-weight:900}.btn{display:inline-block;margin-top:14px;padding:11px 14px;border-radius:14px;background:#29a8ff;color:white;text-decoration:none;font-weight:800}.danger{background:rgba(255,70,70,.16)}.safe{background:rgba(32,220,142,.16)}</style><link rel="stylesheet" href="/static/css/v482_premium_identity.css">
<link rel="stylesheet" href="/static/css/v485_crest_engine.css">
<link rel="stylesheet" href="/static/css/v490_performance_skeletons.css">
<link rel="stylesheet" href="/static/css/v491_final_design_system.css">
<link rel="stylesheet" href="/static/css/v492_live_score.css">
</head><body><main class="wrap"><section class="hero"><span class="tag">V369 · Live Decision Matrix</span><h1>Matriz SHARK de decisión live</h1><p class="muted">Clasifica señales en AUTO SAFE, AGGRESSIVE, WATCH o DANGER usando momentum, presión de mercado y estabilidad live.</p><a class="btn" href="/api/v369/live-decision-matrix?persist=1&limit=24">Actualizar matriz real</a></section><section id="grid" class="grid"></section></main><script>fetch('/api/v369/live-decision-matrix?limit=24').then(r=>r.json()).then(d=>{document.getElementById('grid').innerHTML=(d.items||[]).map(x=>`<article class="card ${x.decision_class==='DANGER'?'danger':x.decision_class==='AUTO_SAFE'?'safe':''}"><span class="tag">${x.decision_class}</span><h3>${x.title}</h3><p class="muted">${x.league||''} · ${x.market||'1X2'} · ${x.pick||''}</p><div class="num">${x.commercial_priority}/100</div><p>${x.context_note}</p><p class="muted">Momentum ${x.momentum_score} · Cuota ${x.quota_behavior_score}</p></article>`).join('')||'<p class="muted">Sin señales todavía. Pulsa actualizar o revisa fuentes de datos.</p>'})</script><script defer src="/static/js/v490_app_speed.js"></script>
</body></html>
