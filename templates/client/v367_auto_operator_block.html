<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SHARK Auto Operator V367</title><style>body{margin:0;background:#07111f;color:#eef7ff;font-family:Inter,system-ui;padding:22px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}.card{background:linear-gradient(145deg,#0d1d33,#081426);border:1px solid rgba(83,180,255,.22);border-radius:20px;padding:18px;box-shadow:0 12px 35px rgba(0,0,0,.28)}.pill{display:inline-block;border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:6px 10px;margin:3px;color:#9edcff}.score{font-size:32px;font-weight:900}.muted{color:#9eb3c7}.good{color:#41f2a4}.warn{color:#ffd166}.bad{color:#ff6b6b}button{background:#139bff;color:white;border:0;border-radius:14px;padding:12px 16px;font-weight:800}</style><link rel="stylesheet" href="/static/css/v482_premium_identity.css">
</head><body><h1>SHARK Auto Operator</h1><p class="muted">Señales convertidas en decisión clara: publicar, revisar, vigilar u ocultar. Pensado para apuestas pequeñas y control premium.</p><button onclick="loadOp(true)">Guardar snapshot V367</button><section id="summary" class="grid"></section><h2>Señales operativas</h2><section id="items" class="grid"></section><script>async function loadOp(persist=false){const r=await fetch('/api/v367/auto-operator?limit=24&persist='+(persist?'1':'0'));const d=await r.json();summary.innerHTML=`<div class="card"><div class="muted">Auto PRO/ELITE</div><div class="score good">${d.counts?.AUTO_PUBLICAR_PRO_ELITE||0}</div></div><div class="card"><div class="muted">Revisión rápida</div><div class="score warn">${d.counts?.PUBLICAR_CON_REVISION_RAPIDA||0}</div></div><div class="card"><div class="muted">En observación</div><div class="score">${d.counts?.MANTENER_EN_OBSERVACION||0}</div></div><div class="card"><div class="muted">Ocultas</div><div class="score bad">${d.counts?.NO_PUBLICAR_AUN||0}</div></div>`;items.innerHTML=(d.items||[]).map(x=>`<article class="card"><span class="pill">${x.exposure_level}</span><span class="pill">${x.operator_status}</span><h3>${x.title||'Partido'}</h3><p class="muted">${x.league||'Liga'} · ${x.market||'1X2'} · Pick: <b>${x.pick||'Revisar'}</b></p><div class="score">${x.priority_score}</div><p class="${x.operator_status?.includes('AUTO')?'good':x.operator_status?.includes('NO')?'bad':'warn'}">${x.stake_hint}</p><p>${x.user_message}</p><p class="muted">${x.why_wait}</p></article>`).join('')||'<div class="card">Sin señales operativas todavía. Genera candidatos desde V365/V366.</div>'}loadOp(false)</script></body></html>
