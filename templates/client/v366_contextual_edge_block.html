<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SHARK Contextual Edge V366</title>
<style>body{margin:0;background:#07111f;color:#eaf4ff;font-family:Inter,system-ui,Arial;padding:22px}.wrap{max-width:1120px;margin:auto}.hero,.card{background:linear-gradient(145deg,rgba(17,35,64,.96),rgba(7,17,31,.96));border:1px solid rgba(93,213,255,.2);border-radius:24px;padding:20px;box-shadow:0 18px 55px rgba(0,0,0,.35)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-top:16px}.pill{display:inline-flex;border:1px solid rgba(255,255,255,.16);border-radius:999px;padding:6px 10px;color:#9fe7ff;font-size:12px;margin:3px}.score{font-size:34px;font-weight:900}.muted{color:#9bb2ca}.good{color:#7dffbd}.warn{color:#ffd36a}.bad{color:#ff8a8a}button{border:0;border-radius:14px;padding:12px 16px;background:#23c7ff;color:#03111c;font-weight:900;cursor:pointer}</style></head><body><div class="wrap"><section class="hero"><span class="pill">V366</span><span class="pill">Contextual Edge Engine</span><h1>SHARK Contextual Edge</h1><p class="muted">Cruza score SHARK, value index, calidad del dato, cuota y riesgo para decir qué se puede enseñar al cliente y qué debe revisar el admin.</p><button onclick="loadEdge(true)">Actualizar y guardar snapshot</button></section><div id="summary" class="grid"></div><div id="items" class="grid"></div></div><script>
async function loadEdge(persist=false){const r=await fetch('/api/v366/contextual-edge?limit=22&persist='+(persist?'1':'0'));const d=await r.json();summary.innerHTML=`<div class="card"><div class="muted">Total señales</div><div class="score">${d.total||0}</div></div><div class="card"><div class="muted">ELITE ready</div><div class="score good">${d.elite_ready||0}</div></div><div class="card"><div class="muted">Publicables</div><div class="score warn">${d.publicable||0}</div></div>`;items.innerHTML=(d.items||[]).map(x=>`<article class="card"><span class="pill">${x.context_level}</span><span class="pill">${x.market}</span><h3>${x.title||'Partido'}</h3><p class="muted">${x.league||'Liga'} · Pick: <b>${x.pick||'Revisar'}</b></p><div class="score">${x.edge_score}</div><p class="${x.commercial_status?.includes('OCULTAR')?'bad':x.commercial_status?.includes('DESTACAR')?'good':'warn'}">${x.commercial_status}</p><p class="muted">${x.explanation}</p></article>`).join('')||'<div class="card">Sin señales todavía. Genera candidatos desde V365/V364 o conecta más datos live.</div>'}loadEdge(false)</script></body></html>
