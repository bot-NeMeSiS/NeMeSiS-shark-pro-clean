<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SHARK Match Flow V382</title><style>body{margin:0;background:#07111f;color:#fff;font-family:Inter,system-ui}.wrap{padding:18px;max-width:980px;margin:auto}.card{background:linear-gradient(135deg,#0d2038,#071522);border:1px solid rgba(0,180,255,.25);border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 12px 36px rgba(0,0,0,.25)}.tag{display:inline-block;border-radius:999px;padding:6px 10px;background:#0a84ff33;border:1px solid #39a8ff55;font-size:12px}.score{font-size:34px;font-weight:900}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.muted{color:#9fb6cc}</style></head><body><main class="wrap"><h1>SHARK Match Flow Engine</h1><p class="muted">Flujo contextual del partido: dominio real, presión falsa, momentum roto y partidos HOT.</p><section id="cards" class="grid"></section></main><script>fetch('/api/v382/match-flow-engine').then(r=>r.json()).then(d=>{cards.innerHTML=d.flows.map(f=>`<article class="card"><span class="tag">${f.flow_state}</span><h2>${f.match_label}</h2><div class="score">${f.dominance_score}/100</div><p>${f.client_message}</p><p class="muted">Min ${f.minute} · ${f.pressure_quality} · ${f.momentum_status}</p><b>${f.shark_signal}</b></article>`).join('')})</script></body></html>
