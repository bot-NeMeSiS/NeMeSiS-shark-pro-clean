<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SHARK Decision Engine V396</title><style>body{margin:0;background:#07111f;color:#eef7ff;font-family:Inter,system-ui,Arial}.wrap{max-width:1120px;margin:auto;padding:22px}.hero{border:1px solid rgba(74,222,255,.22);background:linear-gradient(135deg,rgba(9,21,39,.98),rgba(11,33,58,.9));border-radius:24px;padding:22px;box-shadow:0 20px 70px rgba(0,0,0,.35)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin-top:16px}.card{border:1px solid rgba(255,255,255,.12);border-radius:18px;padding:16px;background:rgba(255,255,255,.05)}.tag{display:inline-flex;padding:7px 10px;border-radius:999px;background:rgba(74,222,255,.14);color:#7ee7ff;font-weight:800;font-size:12px}.action{font-size:22px;font-weight:950;margin:8px 0}.meter{height:9px;border-radius:99px;background:#12243a;overflow:hidden}.bar{height:100%;background:linear-gradient(90deg,#22d3ee,#a3e635)}small{color:#9db1c7}.muted{color:#9db1c7}</style><link rel="stylesheet" href="/static/css/v482_premium_identity.css">
</head><body><main class="wrap"><section class="hero"><span class="tag">V396 · SHARK DECISION ENGINE</span><h1>Decisiones SHARK más claras</h1><p class="muted">ENTRAR, ESPERAR, EVITAR o REVISAR con explicación premium, riesgo contextual y control responsable.</p><div id="grid" class="grid"></div></section></main><script>fetch('/api/v396/shark-decision-engine').then(r=>r.json()).then(d=>{grid.innerHTML=d.decisions.map(x=>`<article class="card"><span class="tag">${x.context_type}</span><div class="action">${x.shark_action}</div><b>${x.match_label}</b><p>${x.user_message}</p><small>${x.explanation}</small><div style="margin-top:12px">Confianza ${x.confidence}%</div><div class="meter"><div class="bar" style="width:${x.confidence}%"></div></div></article>`).join('')})</script></body></html>
