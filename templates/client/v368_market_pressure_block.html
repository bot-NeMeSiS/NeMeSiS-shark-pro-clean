<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SHARK Market Pressure</title><style>body{margin:0;background:#06101f;color:#eaf6ff;font-family:Inter,system-ui,Arial}.wrap{max-width:1120px;margin:0 auto;padding:24px}.hero{border:1px solid rgba(75,211,255,.22);background:linear-gradient(135deg,rgba(9,30,55,.96),rgba(4,12,27,.98));border-radius:24px;padding:22px;box-shadow:0 18px 60px rgba(0,0,0,.35)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-top:18px}.card{border:1px solid rgba(255,255,255,.10);background:rgba(255,255,255,.045);border-radius:20px;padding:16px}.tag{display:inline-flex;padding:5px 9px;border-radius:999px;background:rgba(33,212,253,.13);border:1px solid rgba(33,212,253,.25);font-size:12px}.hot{background:rgba(0,255,170,.10);border-color:rgba(0,255,170,.34)}.red{background:rgba(255,77,109,.12);border-color:rgba(255,77,109,.35)}.orange{background:rgba(255,183,77,.12);border-color:rgba(255,183,77,.35)}.muted{color:#9fb6c9}.num{font-size:28px;font-weight:900}.btn{border:0;border-radius:14px;padding:11px 14px;background:#2dd4ff;color:#03111f;font-weight:800;cursor:pointer}</style><link rel="stylesheet" href="/static/css/v482_premium_identity.css">
<link rel="stylesheet" href="/static/css/v485_crest_engine.css">
</head><body><div class="wrap"><section class="hero"><span class="tag">V368 · Cliente</span><h1>SHARK Market Pressure</h1><p class="muted">Filtro premium para detectar presión de mercado, partidos trampa, estabilidad live y exceso de confianza antes de entrar.</p><button class="btn" onclick="load()">Actualizar señales</button><div id="summary" class="grid"></div><div id="items" class="grid"></div></section></div><script>async function load(){const r=await fetch('/api/v368/market-pressure?persist=1&limit=18');const d=await r.json();summary.innerHTML=`<div class="card"><div class="muted">HOT</div><div class="num">${d.counts?.HOT||0}</div></div><div class="card"><div class="muted">Vigilar</div><div class="num">${d.counts?.AMARILLO||0}</div></div><div class="card"><div class="muted">Alta presión</div><div class="num">${d.counts?.NARANJA||0}</div></div><div class="card"><div class="muted">Trampa</div><div class="num">${d.counts?.ROJO||0}</div></div>`;items.innerHTML=(d.items||[]).map(x=>`<div class="card"><span class="tag ${x.priority_label==='HOT'?'hot':x.priority_label==='ROJO'?'red':x.priority_label==='NARANJA'?'orange':''}">${x.priority_label}</span><h3>${x.title||'Partido'}</h3><p>${x.pick||''}</p><p class="muted">${x.client_note||''}</p><b>Estabilidad ${x.live_stability_score}/100 · Presión ${x.market_pressure_score}/100</b></div>`).join('')||'<p class="muted">Sin señales todavía.</p>'}load()</script></body></html>
