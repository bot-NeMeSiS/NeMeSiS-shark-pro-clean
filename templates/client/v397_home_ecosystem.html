<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Home Ecosystem Feel V397</title><style>body{margin:0;background:#07111f;color:#eef7ff;font-family:Inter,system-ui,Arial}.wrap{max-width:1160px;margin:auto;padding:20px 18px 92px}.hero{border:1px solid rgba(74,222,255,.22);background:radial-gradient(circle at top right,rgba(34,211,238,.18),transparent 35%),linear-gradient(135deg,rgba(9,21,39,.98),rgba(11,33,58,.9));border-radius:26px;padding:22px;box-shadow:0 22px 70px rgba(0,0,0,.38)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin-top:16px}.card{border:1px solid rgba(255,255,255,.12);border-radius:20px;padding:16px;background:rgba(255,255,255,.055);backdrop-filter:blur(12px)}.tag{display:inline-flex;padding:7px 10px;border-radius:999px;background:rgba(74,222,255,.14);color:#7ee7ff;font-weight:900;font-size:12px}.hot{background:rgba(248,113,113,.15);color:#fecaca}.ready{background:rgba(163,230,53,.14);color:#d9f99d}.title{font-size:20px;font-weight:950;margin:10px 0 6px}.muted,small{color:#9db1c7}.btn{display:inline-flex;margin-top:10px;border-radius:14px;padding:10px 12px;background:linear-gradient(135deg,#22d3ee,#2563eb);color:white;text-decoration:none;font-weight:900}.pulse{height:8px;border-radius:99px;background:#12243a;overflow:hidden;margin-top:10px}.bar{height:100%;background:linear-gradient(90deg,#22d3ee,#a3e635)}</style><link rel="stylesheet" href="/static/css/v482_premium_identity.css">
</head><body><main class="wrap"><section class="hero"><span class="tag">V397 · HOME ECOSYSTEM FEEL</span><h1>Inicio más vivo, útil y premium</h1><p class="muted">La home deja de ser una pantalla estática: ahora prepara actividad SHARK, partidos HOT, tendencias, picks y combis vigiladas en un solo ecosistema.</p><div id="feed" class="grid"></div><h2>Actividad SHARK</h2><div id="activity" class="grid"></div></section></main><script>fetch('/api/v397/home-ecosystem').then(r=>r.json()).then(d=>{feed.innerHTML=d.feed.map(x=>`<article class="card"><span class="tag ${x.shark_state==='HOT'?'hot':x.shark_state==='READY'?'ready':''}">${x.feed_type}</span><div class="title">${x.title}</div><p class="muted">${x.subtitle}</p><div class="pulse"><div class="bar" style="width:${x.priority}%"></div></div><a class="btn" href="#">${x.action_label}</a></article>`).join('');activity.innerHTML=d.activity.map(x=>`<article class="card"><span class="tag">${x.activity_type}</span><div class="title">${x.label}</div><small>Intensidad ${x.intensity}%</small><div class="pulse"><div class="bar" style="width:${x.intensity}%"></div></div></article>`).join('')})</script></body></html>
