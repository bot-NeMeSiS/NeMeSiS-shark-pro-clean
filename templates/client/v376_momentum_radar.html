<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SHARK Momentum Radar V376</title><style>body{margin:0;background:#07111f;color:#eef6ff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:1100px;margin:auto;padding:22px}.hero{border:1px solid rgba(84,180,255,.25);background:linear-gradient(135deg,rgba(0,91,180,.25),rgba(4,10,24,.92));border-radius:24px;padding:22px;box-shadow:0 18px 50px rgba(0,0,0,.35)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin-top:18px}.card{border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.055);border-radius:18px;padding:16px}.pill{display:inline-flex;border:1px solid rgba(96,210,255,.28);border-radius:999px;padding:6px 10px;color:#8de7ff;font-weight:800;font-size:12px}.score{font-size:30px;font-weight:900}.muted{color:#9fb3ca}.bar{height:8px;background:rgba(255,255,255,.11);border-radius:999px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#23c6ff,#f3cc52);border-radius:999px}.bottom-space{height:84px}@media(max-width:640px){.wrap{padding:14px}.hero{padding:18px}.grid{grid-template-columns:1fr}}</style><link rel="stylesheet" href="/static/css/v482_premium_identity.css">
</head><body><main class="wrap"><section class="hero"><span class="pill">V376 · LIVE RADAR</span><h1>SHARK Momentum Radar</h1><p class="muted">Centro cliente preparado para leer presión, estabilidad, caos y señales HOT sin duplicar navegación móvil ni botones AI.</p></section><section id="list" class="grid"><div class="card"><b>Cargando radar SHARK…</b><p class="muted">Preparando señales live.</p></div></section><div class="bottom-space"></div></main><script>fetch('/api/v376/momentum-radar?limit=24').then(r=>r.json()).then(d=>{const list=document.getElementById('list');const items=d.items||[];list.innerHTML=items.length?items.map(x=>`<article class="card"><span class="pill">${x.radar_state}</span><h3>${x.match_label}</h3><p class="muted">${x.league}</p><div class="score">${x.momentum_score}/100</div><div class="bar"><div class="fill" style="width:${Math.max(5,Math.min(100,x.momentum_score))}%"></div></div><p>${x.shark_hint}</p><p class="muted">Estabilidad ${x.stability_score} · Caos ${x.chaos_score}</p></article>`).join(''):`<div class="card"><b>Sin datos suficientes todavía</b><p class="muted">Cuando haya señales de picks/live, SHARK llenará este radar.</p></div>`}).catch(()=>{document.getElementById('list').innerHTML='<div class="card"><b>Radar preparado</b><p class="muted">No se pudo leer la API interna ahora mismo.</p></div>'})</script></body></html>
