<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SHARK Historical Brain</title><style>body{margin:0;background:#050b16;color:#f3f8ff;font-family:Inter,Arial,sans-serif}.wrap{max-width:1180px;margin:auto;padding:24px}.hero{border:1px solid rgba(255,210,85,.25);background:linear-gradient(135deg,rgba(120,88,0,.28),rgba(2,8,20,.92));border-radius:28px;padding:24px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;margin-top:18px}.card{border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.06);border-radius:22px;padding:16px}.tag{display:inline-flex;padding:6px 10px;border-radius:999px;background:rgba(255,215,90,.18);font-size:12px;font-weight:900}.muted{color:#aab7c7}.score{font-size:30px;font-weight:950}.btn{display:inline-block;margin-top:14px;padding:11px 14px;border-radius:14px;background:#d8a92f;color:#07111f;text-decoration:none;font-weight:900}</style><link rel="stylesheet" href="/static/css/v482_premium_identity.css">
</head><body><main class="wrap"><section class="hero"><span class="tag">V370 · Historical Brain</span><h1>Memoria histórica SHARK</h1><p class="muted">Perfilado contextual de equipos, tendencia live, fatiga/presión y prioridad comercial para picks y combinadas 1X2.</p><a class="btn" href="/api/v370/historical-brain?persist=1&limit=30">Guardar memoria real</a></section><section id="grid" class="grid"></section></main><script>fetch('/api/v370/historical-brain?limit=30').then(r=>r.json()).then(d=>{document.getElementById('grid').innerHTML=(d.items||[]).map(x=>`<article class="card"><span class="tag">${x.status_label}</span><h3>${x.team_a} vs ${x.team_b}</h3><p class="muted">${x.league}</p><div class="score">${x.confidence_memory}/100</div><p>${x.client_summary}</p><p class="muted">Histórico ${x.historical_strength} · Live ${x.live_trend_strength} · Fatiga ${x.fatigue_pressure}</p></article>`).join('')||'<p class="muted">Aún no hay perfiles. Genera primero matriz live o conecta fuentes reales.</p>'})</script></body></html>
