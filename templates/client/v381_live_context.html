<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SHARK Live Context V381</title><style>body{margin:0;background:#07111f;color:#f4f8ff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}.wrap{max-width:980px;margin:0 auto;padding:18px 16px 96px}.hero{border:1px solid rgba(92,204,255,.28);border-radius:24px;padding:20px;background:linear-gradient(135deg,rgba(0,132,255,.18),rgba(0,0,0,.28));box-shadow:0 18px 60px rgba(0,0,0,.25)}.grid{display:grid;gap:14px;margin-top:16px}.card{border:1px solid rgba(255,255,255,.12);border-radius:20px;padding:16px;background:rgba(255,255,255,.055)}.pill{display:inline-flex;border-radius:999px;padding:6px 10px;background:rgba(0,207,255,.14);border:1px solid rgba(0,207,255,.28);font-size:12px;font-weight:800}.state-HOT{color:#7dffcc}.state-CRITICAL{color:#ffd36e}.state-CHAOTIC{color:#ff8a9a}.state-NORMAL{color:#9fc3ff}.bar{height:8px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden;margin:8px 0}.bar>i{display:block;height:100%;background:linear-gradient(90deg,#36d1ff,#23ffb0);border-radius:99px}.muted{color:#aebbd0}</style><link rel="stylesheet" href="/static/css/v482_premium_identity.css">
</head><body><main class="wrap"><section class="hero"><span class="pill">V381 · SHARK LIVE CONTEXT</span><h1>Contexto LIVE inteligente</h1><p class="muted">Estados NORMAL / HOT / CRITICAL / CHAOTIC preparados para alertas, combinadas y lectura SHARK sin consumo extra de API.</p></section><section id="cards" class="grid"></section></main><script>fetch('/api/v381/live-context-engine').then(r=>r.json()).then(d=>{cards.innerHTML=d.contexts.map(x=>`<article class="card"><span class="pill state-${x.state}">${x.state}</span><h2>${x.match_label}</h2><p>${x.client_message}</p><div class="muted">Minuto ${x.minute} · Acción: <b>${x.shark_action}</b></div><div class="bar"><i style="width:${x.intensity}%"></i></div><small class="muted">Intensidad ${x.intensity}/100 · Momentum ${x.momentum}/100 · Riesgo ${x.risk}/100</small></article>`).join('')}).catch(()=>{cards.innerHTML='<article class="card">SHARK Live Context preparado. Recarga tras deploy si aún no aparece la API.</article>'})</script></body></html>
