<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SHARK Picks Factory V365</title><style>
body{margin:0;background:radial-gradient(circle at top,#102859,#050914 55%,#02040a);color:#eef6ff;font-family:Inter,system-ui,Segoe UI,Arial;padding:18px}.wrap{max-width:1180px;margin:auto}.hero,.card{background:rgba(8,18,38,.82);border:1px solid rgba(99,179,255,.22);border-radius:24px;box-shadow:0 18px 50px rgba(0,0,0,.35);padding:18px;margin-bottom:16px}.hero h1{margin:0;font-size:28px}.muted{color:#9fb3ca}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}.pill{display:inline-flex;padding:7px 11px;border-radius:999px;background:rgba(43,140,255,.14);border:1px solid rgba(104,180,255,.25);font-size:12px}.btn{cursor:pointer;border:0;border-radius:14px;padding:11px 14px;background:linear-gradient(135deg,#2088ff,#00d4ff);color:#02101f;font-weight:800}.item{border:1px solid rgba(255,255,255,.09);border-radius:18px;padding:14px;background:rgba(255,255,255,.045)}.decision{font-weight:900}.PUBLICABLE{color:#47f59d}.REVISAR{color:#ffd166}.ESPERAR{color:#ff8e8e}.big{font-size:24px;font-weight:900}.mini{font-size:12px}.bar{height:8px;border-radius:20px;background:rgba(255,255,255,.1);overflow:hidden}.bar span{display:block;height:100%;background:linear-gradient(90deg,#1c7dff,#00ffcc);width:0}a{color:#8fd4ff}</style><link rel="stylesheet" href="/static/css/v482_premium_identity.css">
<link rel="stylesheet" href="/static/css/v485_crest_engine.css">
<link rel="stylesheet" href="/static/css/v490_performance_skeletons.css">
<link rel="stylesheet" href="/static/css/v491_final_design_system.css">
<link rel="stylesheet" href="/static/css/v492_live_score.css">
</head><body><div class="wrap">
<section class="hero"><span class="pill">V365 · SHARK Picks Factory</span><h1>Fábrica inteligente de picks 1X2</h1><p class="muted">Convierte señales live, calidad de datos y memoria histórica en decisiones claras: PUBLICABLE, REVISAR o ESPERAR.</p><button class="btn" onclick="loadFactory(true)">Generar y guardar candidatos</button> <button class="btn" onclick="loadFactory(false)">Vista rápida sin gastar DB</button></section>
<section class="grid" id="metrics"></section><section class="card"><h2>Picks candidatos</h2><div id="items" class="grid"><p class="muted">Cargando motor SHARK...</p></div></section>
</div><script>
function cls(v){return String(v||'').replace(/[^A-Z]/g,'')}
async function loadFactory(persist=false){
 const r=await fetch('/api/v365/pick-factory?limit=18&persist='+(persist?'1':'0')); const d=await r.json();
 document.getElementById('metrics').innerHTML=[['Generados',d.generated],['Publicables',d.publicables],['Revisar',d.review],['Esperar',d.wait],['Guardados DB',d.saved_total]].map(x=>`<div class="card"><div class="muted mini">${x[0]}</div><div class="big">${x[1]||0}</div></div>`).join('');
 document.getElementById('items').innerHTML=(d.items||[]).map(it=>`<article class="item"><div class="decision ${cls(it.decision)}">${it.decision}</div><h3>${it.title||'Partido'}</h3><p class="muted">${it.league||'Liga'} · Mercado ${it.market||'1X2'}</p><p><b>${it.recommended_pick||'Revisar'}</b></p><div class="bar"><span style="width:${Math.min(100,it.shark_score||0)}%"></span></div><p class="mini">Score ${Number(it.shark_score||0).toFixed(0)}/100 · Value ${Number(it.value_index||0).toFixed(1)} · Cuota ${Number(it.odds_decimal||0).toFixed(2)}</p><p class="muted">Stake: ${it.stake_hint||'controlado'}</p><p>${it.reason||''}</p></article>`).join('') || '<p class="muted">No hay candidatos suficientes todavía. Necesitamos más snapshots live o picks con datos completos.</p>';
}
loadFactory(false);
</script><script defer src="/static/js/v490_app_speed.js"></script>
</body></html>
