<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SHARK Match Personality V372</title>
<style>body{margin:0;background:#07111f;color:#eef6ff;font-family:Inter,Arial,sans-serif}.wrap{max-width:1180px;margin:auto;padding:24px}.hero{background:linear-gradient(135deg,#09233f,#0d5c79);border:1px solid rgba(95,220,255,.25);border-radius:24px;padding:24px;box-shadow:0 18px 50px rgba(0,0,0,.35)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin-top:18px}.card{background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.12);border-radius:20px;padding:18px}.pill{display:inline-block;padding:6px 10px;border-radius:999px;background:rgba(77,214,255,.15);border:1px solid rgba(77,214,255,.35);font-size:12px}.num{font-size:28px;font-weight:800}.muted{color:#9fb4c9}.btn{background:#20d4ff;color:#04101d;text-decoration:none;border-radius:14px;padding:10px 14px;font-weight:800;display:inline-block;margin-top:12px}</style></head>
<body><div class="wrap"><section class="hero"><span class="pill">V372 · Match Personality Engine</span><h1>Personalidad SHARK del partido</h1><p class="muted">Detecta partidos trampa, ritmo real, favorito inestable, presión ofensiva útil y prioridad comercial antes de publicar señales.</p><a class="btn" href="/api/v372/match-personality?persist=1">Actualizar motor V372</a></section><div id="grid" class="grid"></div></div>
<script>
async function load(){const r=await fetch('/api/v372/match-personality?persist=1&limit=30');const d=await r.json();const g=document.getElementById('grid');g.innerHTML=(d.items||[]).map(x=>`<div class="card"><span class="pill">${x.profile_type}</span><h3>${x.team_a} vs ${x.team_b}</h3><p class="muted">${x.league}</p><p>${x.client_summary}</p><div class="num">${x.commercial_priority}/100</div><p class="muted">Fiabilidad live ${x.live_reliability}/100 · Trampa ${x.trap_risk}/100</p></div>`).join('')||'<div class="card">Sin datos suficientes todavía.</div>'}load();
</script></body></html>
