<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SHARK Memory V379</title><style>body{margin:0;background:#06101f;color:#eef6ff;font-family:system-ui}.wrap{padding:22px;max-width:920px;margin:auto}.card{background:linear-gradient(145deg,#08172c,#0c203d);border:1px solid #16466d;border-radius:22px;padding:18px;margin:14px 0;box-shadow:0 16px 40px #0008}.tag{display:inline-block;background:#123a5e;border:1px solid #2de2ff55;border-radius:999px;padding:6px 10px;margin:4px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.btn{background:linear-gradient(135deg,#2de2ff,#ffe66d);color:#001526;border:0;border-radius:16px;padding:12px 16px;font-weight:800}</style><link rel="stylesheet" href="/static/css/v482_premium_identity.css">
<link rel="stylesheet" href="/static/css/v485_crest_engine.css">
</head><body><div class="wrap"><h1>🧠 SHARK Memory Core</h1><p>Memoria persistente preparada para que SHARK aprenda de usuarios, equipos, combinadas y señales sin gastar API extra.</p><button class="btn" onclick="load()">Actualizar memoria</button><div id="out"></div></div><script>async function load(){let r=await fetch('/api/v379/shark-memory-core');let j=await r.json();out.innerHTML=`<div class="grid"><div class="card"><h2>${j.memory_events.length}</h2><p>Memorias base</p></div><div class="card"><h2>${j.profiles.length}</h2><p>Perfiles usuario</p></div><div class="card"><h2>${j.team_memory.length}</h2><p>Patrones equipo</p></div><div class="card"><h2>${j.combi_patterns.length}</h2><p>Patrones combi</p></div></div>`+j.memory_events.map(x=>`<div class="card"><span class="tag">${x.category}</span><h3>${x.entity}</h3><p>${x.summary}</p><b>${x.recommendation}</b></div>`).join('')}load()</script></body></html>
