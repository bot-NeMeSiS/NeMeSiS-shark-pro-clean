<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Estado Producto V380</title><style>body{margin:0;background:#06101f;color:#eef6ff;font-family:system-ui}.wrap{padding:22px;max-width:980px;margin:auto;padding-bottom:110px}.hero{background:linear-gradient(145deg,#071a33,#0c274a);border:1px solid #1f638f;border-radius:26px;padding:22px;box-shadow:0 18px 46px #0009}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-top:14px}.card{background:#09182d;border:1px solid #18496e;border-radius:20px;padding:16px}.score{font-size:34px;font-weight:900;color:#ffe66d}.tag{display:inline-block;border:1px solid #2de2ff66;border-radius:999px;padding:6px 10px;margin:4px;background:#102944}.ok{color:#73ffbd}.btn{background:linear-gradient(135deg,#2de2ff,#ffe66d);color:#001526;border:0;border-radius:16px;padding:12px 16px;font-weight:900}</style><link rel="stylesheet" href="/static/css/v482_premium_identity.css">

</head><body><div class="wrap"><div class="hero"><h1>🚀 NeMeSiS SHARK PRO V380</h1><p>Estado de producto premium: móvil limpio, SHARK Memory preparada, Live Timeline listo y Control Center operativo.</p><button class="btn" onclick="load()">Actualizar estado</button><div id="out"></div></div></div><script>async function load(){let j=await fetch('/api/v380/system-readiness').then(r=>r.json());let items=Object.entries(j.readiness);out.innerHTML=`<div class="grid">${items.map(([k,v])=>`<div class="card"><div class="score">${(v/10).toFixed(1)}</div><b>${k.replaceAll('_',' ')}</b><p class="ok">Operativo</p></div>`).join('')}</div><div class="card"><span class="tag">Release score ${j.release_score}</span><span class="tag">Sin API extra</span><span class="tag">GitHub + Render ready</span></div>`}load()</script><script defer src="/static/js/v490_app_speed.js"></script>
</body></html>
