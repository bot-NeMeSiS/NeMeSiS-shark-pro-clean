name: Render Deploy Guard
# Primary strategy: Render Auto-Deploy from protected main. This workflow never calls a hook.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: "Dry-run the pipeline or verify the current main deployment"
        required: true
        default: dry_run
        type: choice
        options:
          - dry_run
          - verify_existing
      public_base_url:
        description: "Public Render base URL"
        required: true
        default: "https://bot-apuestas-crgf.onrender.com"
        type: string
      monitor_offsets:
        description: "Post-deploy observation offsets in seconds"
        required: true
        default: "0,120,300,900,3600"
        type: string

permissions:
  contents: read

concurrency:
  group: render-deploy-guard-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  PUBLIC_BASE_URL: ${{ inputs.public_base_url || 'https://bot-apuestas-crgf.onrender.com' }}

jobs:
  preflight:
    name: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DB_PATH: ${{ runner.temp }}/nemesis_v937_ci.db
      SECRET_KEY: v937-ci-only-placeholder
      BACKGROUND_JOBS_ENABLED: "false"
      AUTO_GENERATE_PICKS: "false"
      AUTO_SEND_TELEGRAM_PICKS: "false"
    outputs:
      expected_version: ${{ steps.release.outputs.version }}
      expected_sha: ${{ steps.release.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install production dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify installed imports
        run: |
          python -c "import flask, jinja2, PIL, stripe; print('production_imports_ok')"
          python -c "import app; print('app_import_ok')"

      - name: Read release identity
        id: release
        shell: bash
        run: |
          version="$(tr -d '\r\n' < VERSION.txt)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          echo "Expected version: $version"
          echo "Expected SHA: $GITHUB_SHA"

      - name: Compile Python
        run: |
          python -m py_compile app.py
          python -m compileall app.py engines tools automation_workforce

      - name: Parse Jinja
        run: |
          python - <<'PY'
          from pathlib import Path
          from app import app

          parsed = 0
          with app.app_context():
              for path in sorted((Path.cwd() / "templates").rglob("*.html")):
                  app.jinja_env.get_template(path.relative_to(Path.cwd() / "templates").as_posix())
                  parsed += 1
          if parsed == 0:
              raise SystemExit("No Jinja templates found")
          print(f"jinja_templates_ok={parsed}")
          PY

      - name: Critical V937 checks
        run: |
          python tools/check_madrid_times.py
          python tools/check_v915_automated_company_workforce.py
          python tools/check_v937_product_update_client.py
          python tools/check_v937_sports_lifecycle.py
          python tools/check_v937_github_render_pipeline.py

      - name: Navigation Integrity
        run: |
          python tools/check_v929_navigation_integrity.py
          python automation_workforce/navigation_integrity_worker.py --dry-run

      - name: Continuous Sentinel
        run: python tools/run_continuous_sentinel_static.py

      - name: Secret Guard
        run: python automation_workforce/security_secret_guard.py --dry-run

      - name: Route and link audit
        run: |
          python tools/verify_imports_and_routes.py
          python tools/audit_all_routes_links.py

      - name: Release and manifest identity
        run: |
          python tools/print_release_identity.py
          python tools/check_v937_github_render_pipeline.py

      - name: Authorize auto-deploy certification
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Only main pushes may be certified."
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "${{ inputs.mode }}" == "verify_existing" && "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "verify_existing is restricted to main."
            exit 1
          fi
          echo "Preflight authorized for event=$GITHUB_EVENT_NAME ref=$GITHUB_REF sha=$GITHUB_SHA"

      - name: Upload preflight evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: render-preflight-${{ github.run_id }}
          path: reports/
          if-no-files-found: warn
          retention-days: 14

  dry-run:
    name: pipeline-dry-run
    needs: preflight
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'dry_run'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"

      - name: Verify dry-run without network or deploy
        run: |
          python tools/v937_post_deploy_certification.py \
            --mode dry-run \
            --base-url "$PUBLIC_BASE_URL" \
            --expected-version "${{ needs.preflight.outputs.expected_version }}" \
            --expected-sha "${{ needs.preflight.outputs.expected_sha }}" \
            --check-offsets "${{ inputs.monitor_offsets }}"

  certify-production:
    name: certify-production
    needs: preflight
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'verify_existing' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: production
      url: https://bot-apuestas-crgf.onrender.com
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"

      - name: Wait for Render Auto-Deploy and certify exact SHA
        run: |
          python tools/v937_post_deploy_certification.py \
            --mode verify \
            --base-url "$PUBLIC_BASE_URL" \
            --expected-version "${{ needs.preflight.outputs.expected_version }}" \
            --expected-sha "${{ needs.preflight.outputs.expected_sha }}" \
            --deployment-timeout 900 \
            --check-offsets "${{ inputs.monitor_offsets || '0,120,300,900,3600' }}" \
            --report-path reports/V937_POST_DEPLOY_AUTOMATED_EVIDENCE.json

      - name: Upload post-deploy evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: render-post-deploy-${{ github.run_id }}
          path: reports/V937_POST_DEPLOY_AUTOMATED_EVIDENCE.json
          if-no-files-found: warn
          retention-days: 30
