name: Isolated Test Dependencies
on:
  push:
    branches: [chatgpt/sports-reconciliation-evidence-20260921]
    paths: [.github/workflows/sports-source-review.yml]
permissions:
  contents: read
jobs:
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Download wheels for isolated local testing
        run: |
          python -m pip download --only-binary=:all: --no-deps Flask==3.0.3 Werkzeug==3.0.3 blinker==1.9.0 stripe==15.3.0 --dest /tmp/nemesis-test-wheels
      - uses: actions/upload-artifact@v4
        with:
          name: nemesis-isolated-test-wheels
          path: /tmp/nemesis-test-wheels/*.whl
          retention-days: 1
          if-no-files-found: error
