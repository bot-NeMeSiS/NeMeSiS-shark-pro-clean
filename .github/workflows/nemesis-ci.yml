name: NeMeSiS CI QA

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Core compile checks
        run: |
          python -m py_compile app.py
          python -m compileall app.py engines tools automation_workforce

      - name: Cron incident regression tests (mocked transports)
        run: |
          pip install pytest
          python -m pytest tests/test_cron_incident_hotfix.py tests/test_render_cron_master_tick.py tests/test_sports_pipeline_stage_truth.py -q
          python -m pytest tests/test_odds_credentials.py tests/test_odds_cache_credit_guard.py tests/test_odds_admin_pipeline.py -q
          python -m pytest tests/test_unified_sports_truth_phase3.py tests/test_sports_truth_single_source.py tests/test_sports_core_unified_domain_model.py tests/test_sportsdb_provider_identity_regression.py -q

      - name: Project checks
        run: |
          python -m unittest discover -s tests -p test_sports_history.py -v
          python -m unittest discover -s tests -p test_sports_history_operations.py -v

      - name: Existing project checks
        run: |
          python tools/check_madrid_times.py
          if [ -f tools/check_v914_total_self_discovered_corrections.py ]; then python tools/check_v914_total_self_discovered_corrections.py; fi
          python tools/check_v915_automated_company_workforce.py
          python tools/run_continuous_sentinel_static.py
          python tools/verify_imports_and_routes.py

      - name: Route link audit
        run: python tools/audit_all_routes_links.py
        continue-on-error: false

      - name: Build clean release
        run: |
          python tools/build_clean_release.py
          python tools/audit_release_zip.py

      - name: Upload reports and release output
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: nemesis-ci-artifacts
          path: |
            reports/V941_*
            release_output/*_RENDER_READY.zip
            release_output/RELEASE_ZIP_AUDIT_V941.*
