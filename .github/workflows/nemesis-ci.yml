name: NeMeSiS CI QA

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Core compile checks
        run: |
          python -m py_compile app.py
          python -m compileall app.py engines tools automation_workforce

      - name: Cron incident regression tests (mocked transports)
        run: |
          pip install pytest
          python -m pytest tests/test_cron_incident_hotfix.py tests/test_render_cron_master_tick.py tests/test_sports_pipeline_stage_truth.py -q
          python -m pytest tests/test_odds_credentials.py tests/test_odds_cache_credit_guard.py tests/test_odds_admin_pipeline.py -q

      - name: API-Football statistics regressions (mocked provider)
        env:
          BACKGROUND_JOBS_ENABLED: 'false'
          AUTO_GENERATE_PICKS: 'false'
          AUTO_SEND_TELEGRAM_PICKS: 'false'
          DB_PATH: /tmp/nemesis_statistics_ci.db
        run: |
          python -m pytest tests/test_api_football_statistics_refresh.py tests/test_statistics_refresh_integration.py tests/test_match_statistics_zero.py -q

      - name: Project checks
        run: |
          python -m unittest discover -s tests -p test_sports_history.py -v
          python -m unittest discover -s tests -p test_sports_history_operations.py -v

      - name: Real App read-path contracts (fresh guarded worker)
        run: python -B tools/check_v991_app_read_paths.py --output-dir "$RUNNER_TEMP/v991-app-read-paths" -v

      - name: Revenue OS #323 checkout security regressions
        run: python -m unittest discover -s tests -p test_revenue_os_323_checkout.py -v

      - name: Revenue OS #323 authenticated route and lifecycle contracts
        run: python -m pytest tests/test_revenue_os_323_routes.py tests/test_revenue_os_323_lifecycle.py -q

      - name: Existing project checks
        run: |
          python tools/check_madrid_times.py
          if [ -f tools/check_v914_total_self_discovered_corrections.py ]; then python tools/check_v914_total_self_discovered_corrections.py; fi
          python tools/check_v915_automated_company_workforce.py
          python tools/run_continuous_sentinel_static.py
          python tools/verify_imports_and_routes.py

      - name: Route link audit
        run: python tools/audit_all_routes_links.py
        continue-on-error: false

      - name: Build clean release
        run: |
          python tools/build_clean_release.py
          python tools/audit_release_zip.py

      - name: Upload reports and release output
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: nemesis-ci-artifacts
          path: |
            ${{ runner.temp }}/v991-app-read-paths/receipt.json
            ${{ runner.temp }}/v991-app-read-paths/worker.stdout.txt
            ${{ runner.temp }}/v991-app-read-paths/worker.stderr.txt
            ${{ runner.temp }}/v991-app-read-paths/picks-junit.xml
            ${{ runner.temp }}/v991-app-read-paths/picks-unittest-output.txt
            reports/V941_*
            reports/V942_*
            release_output/*_RENDER_READY.zip
            release_output/RELEASE_ZIP_AUDIT_V941.*
            release_output/RELEASE_ZIP_AUDIT_V942.*
