name: Read Original Runtime Catalogue
on:
  push:
    branches: [chatgpt/sports-reconciliation-evidence-20260921]
    paths: [.github/workflows/read-runtime-catalogue.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: accba67240136fc5745ffd5de80e58e33eabbb15
          persist-credentials: false
      - name: Verify and copy only the requested original files
        run: |
          python - <<'PY'
          import hashlib, json, pathlib, subprocess, zipfile
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip() == 'accba67240136fc5745ffd5de80e58e33eabbb15'
          assert subprocess.check_output(['git','hash-object','localization/ui.json'],text=True).strip() == '9aa02a7dc2e43b211f590c930ea65588fb6a61e7'
          out=pathlib.Path('/tmp/nemesis-original-catalogue.zip')
          manifest={}
          with zipfile.ZipFile(out,'w',zipfile.ZIP_DEFLATED) as archive:
              for name in ['localization/ui.json','.python-version']:
                  path=pathlib.Path(name)
                  assert path.is_file() and not path.is_symlink()
                  data=path.read_bytes()
                  manifest[name]=hashlib.sha256(data).hexdigest()
                  archive.writestr(name,data)
              archive.writestr('CATALOGUE_SOURCE_MANIFEST.json',json.dumps({'base':'accba67240136fc5745ffd5de80e58e33eabbb15','files':manifest},indent=2))
          print('Original catalogue copied. No app import, provider calls, account data, secrets, repository writes or deploy.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: original-runtime-catalogue-accba672
          path: /tmp/nemesis-original-catalogue.zip
          retention-days: 1
          if-no-files-found: error
