name: Prepare isolated observation repair
on:
  push:
    branches: [chatgpt/observation-clock-repair-20260921]
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'bot-NeMeSiS/NeMeSiS-shark-pro-clean' && contains(github.event.head_commit.message, '[prepare-observation-repair]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/observation-clock-repair-20260921
      - name: Apply exact-hash reviewed patch on candidate only
        run: |
          python - <<'PYCODE'
          import base64, gzip, hashlib, pathlib, subprocess
          before = {"app.py": "06386e864e6be2a97dd79adff7455e5f11f61a50", "engines/realtime_state_engine.py": "a879b323e46df6ad3970f89edc6724b721622c26"}
          after = {"app.py": "1879f0c53e3ac59a62370906f2aabefee2c283e5", "engines/realtime_state_engine.py": "fd28ba3d037d7d6e93e4f9a901ef425b9bdde412", "tests/test_match_observation_reconciliation.py": "ad02f42f8a953a8a1e406fa4a69e5bf70e8aeb92"}
          def blob(path):
              data = pathlib.Path(path).read_bytes()
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          for path, expected in before.items():
              assert blob(path) == expected, 'Source moved: ' + path
          assert not pathlib.Path('tests/test_match_observation_reconciliation.py').exists()
          patch = gzip.decompress(base64.b64decode(''))
          for args in (['git', 'apply', '--check', '--whitespace=nowarn', '-'], ['git', 'apply', '--whitespace=nowarn', '-']):
              subprocess.run(args, input=patch, check=True)
          for path, expected in after.items():
              assert blob(path) == expected, 'Unexpected output: ' + path
          subprocess.run(['python', '-m', 'py_compile', *after], check=True)
          PYCODE
          git -c core.whitespace=cr-at-eol diff --check
          git add -- app.py engines/realtime_state_engine.py tests/test_match_observation_reconciliation.py
          git -c user.name='NeMeSiS repair validation' -c user.email='actions@users.noreply.github.com' commit -m 'fix(sports): preserve coherent observations during duplicate reconciliation'
          git push origin HEAD:refs/heads/chatgpt/observation-clock-repair-20260921
