name: One-shot scoped operations patch

on:
  push:
    branches: [hotfix/cron-observation-truth-20260914]
    paths: [.github/workflows/ops-apply-bounded-sportsdb.yml]

permissions:
  contents: write

jobs:
  prepare-candidate:
    if: github.repository == 'bot-NeMeSiS/NeMeSiS-shark-pro-clean' && github.ref == 'refs/heads/hotfix/cron-observation-truth-20260914'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      BACKGROUND_JOBS_ENABLED: 'false'
      AUTO_GENERATE_PICKS: 'false'
      AUTO_SEND_TELEGRAM_PICKS: 'false'
      DB_PATH: /tmp/nemesis-ops-isolated.db
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
      - name: Verify exact scope and apply patch
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, pathlib, subprocess
          base='c4a81003de1b5ccdb3036831583e9c1eb65e4417'
          bootstrap={'.ops-bootstrap/existing-files.patch','.github/workflows/ops-apply-bounded-sportsdb.yml'}
          added={'engines/sportsdb_fetch_budget_engine.py','tests/test_ops_sportsdb_fallback_budget.py','tests/test_render_cron_observation_state.py'}
          changed=set(subprocess.check_output(['git','diff','--name-only',base,'HEAD'],text=True).splitlines())
          assert changed == bootstrap|added, changed
          old={'app.py':'9332e0e9f008987c4f642908b7f548d86802ca8c','tools/render_cron_master_tick.py':'cb45461b2e6a7da1aae8745828a063033fe99efd','tests/test_dashboard_runtime_sports_diagnostics_repair.py':'ee1b6429f89b4fd7044b3d9128c2c3418b53a720'}
          for name,expected in old.items():
              assert subprocess.check_output(['git','hash-object',name],text=True).strip()==expected, name
          patch=pathlib.Path('.ops-bootstrap/existing-files.patch')
          assert hashlib.sha256(patch.read_bytes()).hexdigest()=='179a559482eaafaa03ad05dea702453c58d202f5ac4aec4825479d67674c6939'
          subprocess.run(['git','apply','--check',str(patch)],check=True)
          subprocess.run(['git','apply',str(patch)],check=True)
          expected={'app.py':'5954bd8abe3aab724f99dcf576af4c1286d27dfee412d075d4b20cea0dce27b0','engines/sportsdb_fetch_budget_engine.py':'fccee4767f076560ffd20efa08de939065c5da4c65ae04f6b99407a26619c5c4','tools/render_cron_master_tick.py':'813ae31b2e3bdb6fc4c728f46257cb41c755676f53842a9dd285352a3729571b','tests/test_ops_sportsdb_fallback_budget.py':'6d798ba8a33153717e891761fb4c7caf6acf012607ffba022f1fa205fb2dd939','tests/test_render_cron_observation_state.py':'8d9577ff2f63b99ddb83d7cd93060fbb43eb470b3827b8546a84e2e88d9171cb','tests/test_dashboard_runtime_sports_diagnostics_repair.py':'d970eb3c9f3348fe1ab419d633848bbc9713738845603cf19303bff21ea21011'}
          for name,digest in expected.items():
              assert hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest()==digest, name
          subprocess.run(['git','diff','--check'],check=True)
          print('EXACT_CANDIDATE_VERIFIED; no production actions')
          PY
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate candidate without providers or production
        run: |
          python -m py_compile app.py engines/sportsdb_fetch_budget_engine.py tools/render_cron_master_tick.py
          python -m pytest -q tests/test_ops_sportsdb_fallback_budget.py tests/test_render_cron_master_tick.py tests/test_render_cron_observation_state.py --junitxml=/tmp/nemesis-ops-focal.xml
      - name: Save only validated candidate on this branch
        shell: bash
        run: |
          test "$GITHUB_REF" = 'refs/heads/hotfix/cron-observation-truth-20260914'
          git add -- app.py tools/render_cron_master_tick.py tests/test_dashboard_runtime_sports_diagnostics_repair.py
          git rm -- .ops-bootstrap/existing-files.patch .github/workflows/ops-apply-bounded-sportsdb.yml
          git diff --cached --check
          python - <<'PY'
          import subprocess
          expected={'app.py','tools/render_cron_master_tick.py','tests/test_dashboard_runtime_sports_diagnostics_repair.py','.ops-bootstrap/existing-files.patch','.github/workflows/ops-apply-bounded-sportsdb.yml'}
          actual=set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          assert actual==expected,actual
          PY
          git config user.name 'NeMeSiS Operations Candidate'
          git config user.email 'noreply@users.noreply.github.com'
          git commit -m 'fix(ops): bound SportsDB fallback and clarify current observations'
          git push origin HEAD:refs/heads/hotfix/cron-observation-truth-20260914
      - name: Preserve scoped test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ops-budget-focal
          path: /tmp/nemesis-ops-focal.xml
          if-no-files-found: warn
          retention-days: 14
