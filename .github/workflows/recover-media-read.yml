name: Verify and commit recovered media readers
on:
  push:
    branches: [fix/highlights-read-consumers-recovery-20261001]
    paths: [.github/workflows/recover-media-read.yml]
permissions:
  contents: write
jobs:
  verify:
    if: github.ref == 'refs/heads/fix/highlights-read-consumers-recovery-20261001'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DB_PATH: /tmp/media-recovery-isolated.sqlite
      BACKGROUND_JOBS_ENABLED: 'false'
      AUTO_GENERATE_PICKS: 'false'
      AUTO_SEND_TELEGRAM_PICKS: 'false'
      SCHEDULER_ENABLED: '0'
      ENABLE_AUTO_SYNC: '0'
      AUTO_SYNC_ON_STARTUP: '0'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11.9'
      - name: Read the fixed historical source and immutable verified patch
        run: |
          git fetch --filter=blob:none --no-tags origin ac2e43df6c13b01b353ba692db3f01c4cb4d7b9f
          python - <<'PY'
          import subprocess,textwrap,hashlib,ast,json
          from pathlib import Path
          spec=subprocess.check_output(['git','show','454d0fc7a984e29c3fe5f8c3aa30ae4cda6477de:.github/workflows/recover-media-read.yml']).decode()
          blocks=spec.split("          python - <<'PY'\n")[1:]
          assert len(blocks)==2
          scripts=[textwrap.dedent(b.split('\n          PY',1)[0]) for b in blocks]
          # The previous run verified all four before/after hashes and 242 tests.
          # Reuse precisely that reviewed code, then remove only six EOF bytes.
          exec(compile(scripts[0],'reviewed-selective-recovery-454d0fc','exec'))
          path=Path('app.py');before=path.read_bytes()
          assert hashlib.sha256(before).hexdigest()=='67aa50e86e5d130fc7a855c5ac7b02c58cd808c4abf54646e40c23a5a2166c49'
          after=before.rstrip(b'\r\n')+b'\r\n'
          assert ast.dump(ast.parse(before))==ast.dump(ast.parse(after))
          assert hashlib.sha256(after).hexdigest()=='f42d077ab99fd3afbeb3911f84f2fa0fc2beec961044e30939409c3822ea9d94'
          path.write_bytes(after)
          evidence=Path('/tmp/media-recovery-evidence')
          (evidence/'normalized-app-sha256.txt').write_text(hashlib.sha256(after).hexdigest())
          # Executed with project cwd/import path, not as an imported remote module.
          Path('/tmp/media-recovery-tests.py').write_text(scripts[1])
          PY
      - name: Install isolated dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Repeat complete 242-case recovery gate before commit
        run: |
          python -c "exec(compile(open('/tmp/media-recovery-tests.py').read(), 'verified-media-tests', 'exec'))"
          python -m py_compile app.py engines/sportsdb_highlights_engine.py
          python tools/check_madrid_times.py
      - name: Commit only verified product and regression files
        run: |
          test "$GITHUB_REF" = refs/heads/fix/highlights-read-consumers-recovery-20261001
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py engines/sportsdb_highlights_engine.py templates/highlight_detail.html templates/admin_highlights_center.html tests/test_highlight_catalogue_read_truth.py tests/test_highlight_read_diagnostic.py
          git -c core.whitespace=blank-at-eol,blank-at-eof,space-before-tab,cr-at-eol diff --cached --check
          git commit -m 'Fix: recuperar lectores de highlights, incertidumbre y reproductor por acción'
          git push origin HEAD:refs/heads/fix/highlights-read-consumers-recovery-20261001
          git rev-parse HEAD > /tmp/media-recovery-evidence/source-commit.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: media-reader-recovery-${{ github.run_id }}
          path: /tmp/media-recovery-evidence/
          retention-days: 14
          if-no-files-found: warn
