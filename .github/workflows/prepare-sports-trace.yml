name: Prepare reviewed sports trace candidate
on:
  push:
    branches: [chatgpt/sportsdb-reconciliation-trace-20260921]
    paths: [.github/workflows/prepare-sports-trace.yml]
permissions:
  contents: write
concurrency:
  group: prepare-sports-trace-20260921
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/chatgpt/sportsdb-reconciliation-trace-20260921' && startsWith(github.event.head_commit.message, '[prepare-sports-trace]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify and apply reviewed seven-file candidate
        shell: bash
        run: |
          python - <<'PY'
          import ast, base64, hashlib, json, pathlib, zlib
          encoded = ''''''
          data = zlib.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(data).hexdigest() == '51084c209f01578f1558d3e6a161500fe0c902e38c4bc8d1e7fb7c3827f1bf9e', 'Transport hash mismatch'
          bundle = json.loads(data)
          allowed = {'app.py','tools/render_cron_master_tick.py','engines/founder_os_engine.py','templates/admin_founder_os.html','engines/sportsdb_reconciliation_trace.py','tools/sportsdb_reconciliation_contract.py','tests/test_sportsdb_reconciliation_trace.py'}
          assert set(bundle) == allowed
          outputs = {}
          for name, spec in bundle.items():
              path = pathlib.Path(name)
              if spec['before'] is None:
                  assert not path.exists(), name
                  result = spec['content'].encode('utf-8')
              else:
                  before = path.read_bytes()
                  assert hashlib.sha256(before).hexdigest() == spec['before'], 'Source drift: '+name
                  lines = before.splitlines(keepends=True)
                  for start, end, replacement in reversed(spec['changes']):
                      lines[start:end] = [replacement.encode('utf-8')]
                  result = b''.join(lines)
              assert hashlib.sha256(result).hexdigest() == spec['after'], 'Output mismatch: '+name
              if name.endswith('.py'):
                  ast.parse(result.decode('utf-8'), filename=name)
              outputs[name] = result
          for name, result in outputs.items():
              path=pathlib.Path(name)
              path.parent.mkdir(parents=True,exist_ok=True)
              path.write_bytes(result)
              print(name, hashlib.sha256(result).hexdigest())
          PY
      - name: Commit candidate only, never main
        shell: bash
        run: |
          test "$GITHUB_REF_NAME" = 'chatgpt/sportsdb-reconciliation-trace-20260921'
          git config user.name 'NeMeSiS candidate preparation'
          git config user.email 'candidate@users.noreply.github.com'
          git add app.py tools/render_cron_master_tick.py engines/founder_os_engine.py templates/admin_founder_os.html engines/sportsdb_reconciliation_trace.py tools/sportsdb_reconciliation_contract.py tests/test_sportsdb_reconciliation_trace.py
          git commit -m 'feat(sports): trace individual SportsDB observations through committed persistence'
          git push origin HEAD:chatgpt/sportsdb-reconciliation-trace-20260921
