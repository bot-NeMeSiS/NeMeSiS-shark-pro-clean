name: Browser QA

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/browser-qa.yml'
      - 'app.py'
      - 'templates/**'
      - 'static/**'
      - 'engines/**'
      - 'tests/**'
      - 'conftest.py'
      - 'pytest.ini'
      - 'requirements*.txt'
      - 'browser_qa/playwright_requirements.txt'
      - 'tools/run_v929_click_navigation_qa.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/browser-qa.yml'
      - 'app.py'
      - 'templates/**'
      - 'static/**'
      - 'engines/**'
      - 'tests/**'
      - 'conftest.py'
      - 'pytest.ini'
      - 'requirements*.txt'
      - 'browser_qa/playwright_requirements.txt'
      - 'tools/run_v929_click_navigation_qa.py'
  workflow_dispatch:
    inputs:
      base_url:
        description: "Base URL to capture"
        required: true
        default: "https://bot-apuestas-crgf.onrender.com"

permissions:
  contents: read

jobs:
  premium-visual:
    name: premium-visual
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
      - name: Verify committed CSS and semantic states
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm run check:css
          python -m pip install -r requirements-dev.txt -r browser_qa/playwright_requirements.txt tzdata
          python -m playwright install --with-deps chromium
          python -m pytest -o addopts='' -q tests/test_premium_visual_system.py tests/test_design02_calendar_presentation.py tests/test_contextual_sports_entity_navigation.py
      - name: Capture isolated desktop and mobile surfaces
        run: |
          python tools/run_visual_preview.py > /tmp/visual-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid"' EXIT
          python - <<'PY'
          import time, urllib.request
          for attempt in range(60):
              try:
                  urllib.request.urlopen('http://127.0.0.1:54920/cliente-login', timeout=2)
                  break
              except OSError:
                  time.sleep(1)
          else:
              raise SystemExit('Visual preview failed to start')
          PY
          python tools/run_visual_browser_qa.py --output /tmp/premium-visual-evidence
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: premium-visual-${{ github.run_id }}
          path: |
            /tmp/premium-visual-evidence/
            /tmp/visual-preview.log
          retention-days: 7

  journey-controls:
    name: journey-controls
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DB_PATH: /tmp/nemesis-journey-${{ github.run_id }}/app.sqlite3
      SECRET_KEY: isolated-journey-ci-only
      BACKGROUND_JOBS_ENABLED: 'false'
      AUTO_GENERATE_PICKS: 'false'
      AUTO_SEND_TELEGRAM_PICKS: 'false'
      NEMESIS_JOURNEY_EVIDENCE_DIR: /tmp/nemesis-journey-${{ github.run_id }}/evidence
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11.9'
      - name: Install isolated test dependencies
        run: |
          python -m pip install -r requirements-dev.txt -r browser_qa/playwright_requirements.txt
          python -m playwright install --with-deps chromium
          python -c 'from playwright.sync_api import sync_playwright'
      - name: Verify native controls, layout and existing regressions
        run: |
          mkdir -p "$NEMESIS_JOURNEY_EVIDENCE_DIR"
          python -c 'import app; app.init_db()'
          python -m pytest -o addopts='' -q \
            tests/test_journey_controls_browser.py \
            tests/test_telegram_user_preferences.py \
            tests/test_auth_shell_fastpath.py \
            tests/test_client_core_fastpaths_wave2.py \
            tests/test_founder_os_fastpath.py \
            --junitxml="$NEMESIS_JOURNEY_EVIDENCE_DIR/results.xml"
          python - <<'PY'
          import os
          from pathlib import Path
          from xml.etree import ElementTree
          evidence = Path(os.environ['NEMESIS_JOURNEY_EVIDENCE_DIR'])
          cases = ElementTree.parse(evidence / 'results.xml').findall('.//testcase')
          browser_cases = [case for case in cases if 'test_journey_controls_browser' in case.get('classname', '')]
          assert len(browser_cases) >= 32, 'The browser matrix did not execute completely'
          assert all(case.find(tag) is None for case in browser_cases for tag in ('skipped', 'failure', 'error'))
          (evidence / 'source-commit.txt').write_text(os.environ['GITHUB_SHA'] + '\n', encoding='utf-8')
          print(f'Browser cases executed successfully: {len(browser_cases)}')
          PY
      - name: Upload isolated evidence
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: journey-controls-${{ github.run_id }}
          path: /tmp/nemesis-journey-${{ github.run_id }}/evidence/
          if-no-files-found: warn
          retention-days: 7

  browser-qa:
    # Remote reference captures remain explicit; PR/push checks run locally only.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BROWSER_QA_BASE_URL: ${{ inputs.base_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install app dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r browser_qa/playwright_requirements.txt

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Check browser environment
        run: python tools/check_browser_qa_environment.py

      - name: Run Browser QA
        run: python tools/run_browser_reference_qa.py --base-url "$BROWSER_QA_BASE_URL" --output reports/browser_qa_render --mobile --desktop --write-json

      - name: Import Browser QA results
        run: python tools/import_browser_qa_results.py --input reports/browser_qa_render --update-runtime-data

      - name: Upload Browser QA artifacts
        uses: actions/upload-artifact@v7
        with:
          name: browser-qa-render
          path: |
            reports/browser_qa_render
            data/runtime/autonomous_company_sentinel/browser_qa_status.json
            data/runtime/autonomous_company_sentinel/browser_reference_comparison.json
            data/runtime/autonomous_company_sentinel/reference_gap_report.json
            data/runtime/autonomous_company_sentinel/visual_fix_queue.json
