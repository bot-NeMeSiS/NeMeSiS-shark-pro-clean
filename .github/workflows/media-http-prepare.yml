name: Verify media HTTP read contract
on:
  push:
    branches: [fix/highlights-read-consumers-recovery-20261001]
    paths: [.github/workflows/media-http-prepare.yml]
permissions:
  contents: write
jobs:
  verify:
    if: github.ref == 'refs/heads/fix/highlights-read-consumers-recovery-20261001'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DB_PATH: /tmp/media-http-read-isolated.sqlite
      BACKGROUND_JOBS_ENABLED: 'false'
      AUTO_GENERATE_PICKS: 'false'
      AUTO_SEND_TELEGRAM_PICKS: 'false'
      SCHEDULER_ENABLED: '0'
      ENABLE_AUTO_SYNC: '0'
      AUTO_SYNC_ON_STARTUP: '0'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11.9'
      - name: Apply the reviewed exact HTTP boundary correction
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,ast
          p=Path('app.py'); raw=p.read_bytes()
          assert hashlib.sha256(raw).hexdigest()=='f42d077ab99fd3afbeb3911f84f2fa0fc2beec961044e30939409c3822ea9d94'
          changes=[
          ('    "apple_touch_icon",\n    "static",','    "apple_touch_icon",\n    "highlight_detail_page",  # Media GETs never own schema creation or seed work.\n    "static",'),
          ('    timeout_ms = max(100, min(as_int(os.getenv("SQLITE_READ_BUSY_TIMEOUT_MS", "750"), 750), 2500))\n    try:\n        if db_path != ":memory:" and Path(db_path).exists():','    timeout_ms = max(100, min(as_int(os.getenv("SQLITE_READ_BUSY_TIMEOUT_MS", "750"), 750), 2500))\n    media_read_only = request.endpoint == "highlight_detail_page"\n    try:\n        if db_path != ":memory:" and (media_read_only or Path(db_path).exists()):'),
          ('            except sqlite3.Error:\n                pass\n        return None\n\n\ndef slug(text):','            except sqlite3.Error:\n                pass\n        if media_read_only:\n            raise  # Never fall back to creating a database from a media read.\n        return None\n\n\ndef slug(text):'),
          ('    snapshot = v769_get_highlight_snapshot(highlight_id)\n    if snapshot.get("ok") is not True:','    snapshot = v769_get_highlight_snapshot(highlight_id)\n    if snapshot.get("read_state") == "CATALOGUE_NOT_INITIALIZED":\n        # The database was readable and its schema confirms no local catalogue.\n        # This individual resource is absent; global coverage counts stay unknown.\n        return render_template("resource_unavailable.html", title="Resumen no disponible",\n            resource_title="Este resumen todavía no está disponible",\n            resource_message="No hay un resumen registrado para este identificador. Vuelve al partido para consultar su cobertura."), 404\n    if snapshot.get("ok") is not True:'),
          ('    data = dashboard_data("results", today_iso())\n    data["highlight"] = snapshot.get("highlight") or {}','    data = {"highlight": snapshot.get("highlight") or {}}'),
          ('    data["v769_highlights_center"] = v769_highlights_content_center(data, current_session_user(), limit=8)\n    return render_template("highlight_detail.html", data=data)','    return render_template("highlight_detail.html", data=data)'),
          ('or request.path.startswith("/highlight/")) and not is_admin_session():','or request.endpoint == "highlight_detail_page") and not is_admin_session():'),
          ('        except sqlite3.OperationalError:\n            app.logger.warning("UI locale profile unavailable; using browser preference")','        except sqlite3.Error:\n            app.logger.warning("UI locale profile unavailable; using browser preference")'),
          ]
          s=raw.decode()
          for a,b in changes:
              for eol in ('\r\n','\n'):
                  aa=a.replace('\n',eol)
                  if s.count(aa)==1:
                      s=s.replace(aa,b.replace('\n',eol),1);break
              else:raise ValueError('Patch input was not unique')
          ast.parse(s); result=s.encode()
          assert hashlib.sha256(result).hexdigest()=='702f68047b185cacdeab09ffdd63e4031135b42e09cf1028670022f151e36a59'
          p.write_bytes(result)
          PY
      - name: Install isolated test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: All recovery regressions and real Flask navigation hooks
        run: |
          python - <<'PY'
          import os,secrets,socket,pytest,json
          from pathlib import Path
          for key in list(os.environ):
              if any(s in key for s in ('API_KEY','BOT_TOKEN','AUTOMATION_SECRET','STRIPE_SECRET','PUBLIC_BASE_URL')):os.environ.pop(key,None)
          os.environ['SECRET_KEY']=secrets.token_hex(32)
          os.environ['AUTOMATION_SECRET']=secrets.token_hex(32)
          original=socket.socket.connect
          def guard(self,address):
              if isinstance(address,tuple) and address[0] not in {'127.0.0.1','localhost','::1'}:raise AssertionError('External network forbidden')
              return original(self,address)
          socket.socket.connect=guard
          import app
          app.init_db()
          out=Path('/tmp/media-http-read-evidence');out.mkdir()
          files=['test_highlight_http_cold_read','test_highlight_read_consumer_recovery','test_highlight_catalogue_read_truth','test_highlight_read_diagnostic','test_postmatch_recovery','test_highlight_review_flow','test_highlights_admin_review_activation','test_sports_media_rights_convergence','test_sports_knowledge_media_experience','test_sportsdb_dedupe_read_budget','test_sportsdb_provider_identity_regression','test_v944_match_center_foundation','test_match_context_intelligence_continuation','test_sports_core_match_center_intelligence','test_design02_reference_conformance','test_render_cron_master_tick','test_active_cron_header_transport_v941','test_render_cron_data_backup']
          code=pytest.main(['-o','addopts=','-q',*['tests/'+f+'.py' for f in files],'--junitxml='+str(out/'results.xml')])
          if code:raise SystemExit(code)
          from xml.etree import ElementTree as ET
          cases=ET.parse(out/'results.xml').findall('.//testcase')
          assert len(cases)==281
          assert all(c.find(t) is None for c in cases for t in ('failure','error','skipped'))
          from engines.navigation_integrity_engine import smoke_navigation
          navigation=smoke_navigation(app.app)
          (out/'navigation.json').write_text(json.dumps(navigation,ensure_ascii=False,indent=2))
          assert not navigation['failures'], navigation['failures']
          assert len(navigation['dynamic_missing'])==3
          assert all(r['status']==404 for r in navigation['dynamic_missing'])
          for name in app.app.jinja_env.list_templates():app.app.jinja_env.parse(app.app.jinja_env.loader.get_source(app.app.jinja_env,name)[0])
          print('281 tests plus 47 full Flask navigation requests passed; no external providers.')
          PY
          python -m py_compile app.py
          python tools/check_madrid_times.py
      - name: Commit only the verified route correction
        run: |
          test "$GITHUB_REF" = refs/heads/fix/highlights-read-consumers-recovery-20261001
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py
          git -c core.whitespace=blank-at-eol,blank-at-eof,space-before-tab,cr-at-eol diff --cached --check
          git commit -m 'Fix: lectura HTTP de resúmenes sin inicialización y estados de catálogo precisos'
          git push origin HEAD:refs/heads/fix/highlights-read-consumers-recovery-20261001
          git rev-parse HEAD > /tmp/media-http-read-evidence/source-commit.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: media-http-read-${{ github.run_id }}
          path: /tmp/media-http-read-evidence/
          retention-days: 14
          if-no-files-found: warn
