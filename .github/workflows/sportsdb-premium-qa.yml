name: SportsDB Premium QA
on:
  pull_request:
    paths:
      - '.github/workflows/sportsdb-premium-qa.yml'
      - 'engines/sportsdb*'
      - 'engines/postmatch*'
      - 'app.py'
      - 'tests/test_sportsdb*'
      - 'tests/test_postmatch*'
  push:
    branches: [main]
    paths:
      - '.github/workflows/sportsdb-premium-qa.yml'
      - 'engines/sportsdb*'
      - 'engines/postmatch*'
      - 'app.py'
      - 'tests/test_sportsdb*'
      - 'tests/test_postmatch*'
permissions:
  contents: read
concurrency:
  group: sportsdb-premium-${{ github.ref }}
  cancel-in-progress: true
jobs:
  premium-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      THESPORTSDB_KEY: ''
      THESPORTSDB_API_KEY: ''
      API_FOOTBALL_KEY: ''
      API_FOOTBALL_API_KEY: ''
      THE_ODDS_API_KEY: ''
      OPENAI_API_KEY: ''
      TELEGRAM_BOT_TOKEN: ''
      ENABLE_AUTO_SYNC: 'false'
      SCHEDULER_ENABLED: '0'
      AUTO_SYNC_ON_STARTUP: 'false'
      BACKGROUND_JOBS_ENABLED: 'false'
      AUTO_GENERATE_PICKS: 'false'
      AUTO_SEND_TELEGRAM_PICKS: 'false'
      DB_PATH: /tmp/sportsdb-premium-${{ github.run_id }}/app.sqlite
      SECRET_KEY: isolated-sportsdb-ci-only
      AUTOMATION_SECRET: isolated-sportsdb-cron-only
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile, parse Jinja and initialize temporary test storage
        run: |
          mkdir -p sportsdb-qa
          python -m compileall -q app.py engines services blueprints tests
          python - <<'PY'
          import app
          from pathlib import Path
          app.init_db()
          paths=list(Path('templates').rglob('*.html'))
          for path in paths:
              app.app.jinja_env.parse(path.read_text(encoding='utf-8'))
          Path('sportsdb-qa/jinja-count.txt').write_text(str(len(paths)))
          print('Jinja templates parsed:',len(paths))
          PY
      - name: Full focused regressions including Flask, with no provider keys
        run: |
          python -m pytest -o addopts='' -q \
            tests/test_sportsdb_premium_efficiency.py \
            tests/test_sportsdb_highlight_persistence.py \
            tests/test_postmatch_recovery.py \
            tests/test_highlight_review_flow.py \
            tests/test_highlights_admin_review_activation.py \
            tests/test_sports_media_rights_convergence.py \
            tests/test_sports_knowledge_media_experience.py \
            tests/test_sportsdb_dedupe_read_budget.py \
            tests/test_sportsdb_provider_identity_regression.py \
            tests/test_v944_match_center_foundation.py \
            tests/test_match_context_intelligence_continuation.py \
            tests/test_sports_core_match_center_intelligence.py \
            tests/test_design02_reference_conformance.py \
            tests/test_render_cron_master_tick.py \
            tests/test_active_cron_header_transport_v941.py \
            tests/test_render_cron_data_backup.py \
            --junitxml=sportsdb-qa/results.xml
          python tools/check_madrid_times.py
      - name: Verify executed evidence
        run: |
          python - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          from xml.etree import ElementTree
          cases=ElementTree.parse('sportsdb-qa/results.xml').findall('.//testcase')
          assert len(cases)>=236, 'Regression matrix incomplete'
          assert all(c.find(t) is None for c in cases for t in ('failure','error','skipped'))
          files=['app.py','engines/sportsdb_request_budget.py','engines/sportsdb_highlights_engine.py','engines/postmatch_sources.py','engines/postmatch_recovery.py','tests/test_postmatch_recovery.py','tests/test_sportsdb_premium_efficiency.py']
          hashes={p:hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in files}
          Path('sportsdb-qa/summary.json').write_text(json.dumps({'tests':len(cases),'failed':0,'errors':0,'skipped':0,'checkout_sha':os.environ['GITHUB_SHA'],'source_hashes':hashes,'production_changed':False,'real_provider_calls':0},indent=2))
          print('Verified tests:',len(cases))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sportsdb-premium-tests-${{ github.run_id }}
          path: sportsdb-qa/
          retention-days: 7
