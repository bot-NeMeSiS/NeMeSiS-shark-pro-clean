name: Verify and commit journey controls
on:
  push:
    branches: [fix/journey-responsive-evidence-20261001]
    paths: [.github/workflows/journey-review-bundle.yml]
permissions:
  contents: write
jobs:
  verify:
    if: github.ref == 'refs/heads/fix/journey-responsive-evidence-20261001'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DB_PATH: /tmp/journey_controls_ci.db
      SECRET_KEY: isolated-journey-ci-only
      BACKGROUND_JOBS_ENABLED: 'false'
      AUTO_GENERATE_PICKS: 'false'
      AUTO_SEND_TELEGRAM_PICKS: 'false'
      NEMESIS_JOURNEY_EVIDENCE_DIR: /tmp/journey-controls-evidence
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/journey-responsive-evidence-20261001
          fetch-depth: 2
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11.9'
      - name: Apply the immutable patch already verified by 65 passing tests
        run: |
          python - <<'PY'
          import subprocess, textwrap
          # This exact, previously reviewed patch checks the SHA256 of all three
          # files before and after editing. It never edits backend or workflow files.
          spec = subprocess.check_output(['git', 'show', '51a7b2b0fc76d9f5234e16474c32fcd395b54d3a:.github/workflows/journey-review-bundle.yml']).decode('utf-8')
          start = "          python - <<'PY'\n"
          end = "\n          PY\n"
          assert spec.count(start) == 1
          code = textwrap.dedent(spec.split(start, 1)[1].split(end, 1)[0])
          exec(compile(code, 'verified-journey-patch-51a7b2b0', 'exec'))
          PY
      - name: Install isolated test dependencies
        run: |
          python -m pip install -r requirements-dev.txt -r browser_qa/playwright_requirements.txt
          python -m playwright install --with-deps chromium
      - name: Browser controls and existing preference regressions
        run: |
          python -c 'import app; app.init_db()'
          python -m pytest -o addopts='' -q tests/test_journey_controls_browser.py tests/test_telegram_user_preferences.py tests/test_auth_shell_fastpath.py tests/test_client_core_fastpaths_wave2.py tests/test_founder_os_fastpath.py --junitxml=/tmp/journey-controls-evidence/results.xml
          python tools/check_madrid_times.py
      - name: Commit only the tested product files
        run: |
          test "$GITHUB_REF" = refs/heads/fix/journey-responsive-evidence-20261001
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add static/v933-product.css templates/telegram.html templates/base.html
          # The tracked CSS already uses CRLF. Preserve its bytes and continue
          # rejecting real trailing spaces, blank EOF lines and space-before-tab.
          git -c core.whitespace=blank-at-eol,blank-at-eof,space-before-tab,cr-at-eol diff --cached --check
          git commit -m 'Fix: controles Telegram y cabeceras responsive con 65 pruebas correctas'
          git push origin HEAD:refs/heads/fix/journey-responsive-evidence-20261001
          git rev-parse HEAD > /tmp/journey-controls-evidence/commit.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: journey-controls-evidence-${{ github.run_id }}
          path: /tmp/journey-controls-evidence/
          if-no-files-found: warn
          retention-days: 7
