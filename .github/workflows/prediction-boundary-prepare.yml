name: Verify exact prediction publication fix
on:
  push:
    branches: [feat/own-predictions-evidence-20261001]
    paths: [.github/workflows/prediction-boundary-prepare.yml]
permissions:
  contents: write
jobs:
  verify:
    if: github.ref == 'refs/heads/feat/own-predictions-evidence-20261001'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DB_PATH: /tmp/nemesis-prediction-boundary.sqlite
      BACKGROUND_JOBS_ENABLED: 'false'
      AUTO_GENERATE_PICKS: 'false'
      AUTO_SEND_TELEGRAM_PICKS: 'false'
      SCHEDULER_ENABLED: '0'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11.9'
      - name: Apply only the hash-verified publication boundary and admin copy
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          def edit(name, before, after, pairs):
              path=Path(name); raw=path.read_bytes()
              assert hashlib.sha256(raw).hexdigest()==before, name
              for old,new in pairs:
                  for eol in (b'\r\n',b'\n'):
                      a=old.encode().replace(b'\n',eol); b=new.encode().replace(b'\n',eol)
                      if raw.count(a)==1:
                          raw=raw.replace(a,b,1); break
                  else: raise AssertionError('Patch input is not unique: '+name)
              assert hashlib.sha256(raw).hexdigest()==after, name
              path.write_bytes(raw)
          edit('app.py','9c59f16603ed4c9a0950f7f5b7f697869090c24c4b1bc03ed488ea504693cda2','7d6ff84abaa867b8a4148311d0cb9d7006ddefb84bf344f118cb0fca68fe5f3e',[
          ('''    for rec in recs:
                  score = as_int(rec.get("score"), 0)
                  odds = as_float(rec.get("odds_value") or rec.get("odds"), 0.0)
                  if score < min_score:''', '''    for rec in recs:
                  # A watchlist/analysis is not a weak pick: it has no publication approval.
                  if rec.get("can_publish") is not True or rec.get("decision") != "BET":
                      discarded.append({"match_id": rec.get("match_id"), "reason": "analisis_no_publicable"})
                      continue
                  score = as_int(rec.get("score"), 0)
                  raw_odds = rec.get("odds_value")
                  if raw_odds in (None, ""):
                      raw_odds = rec.get("odds")
                  odds = as_float(raw_odds, 0.0)
                  if isinstance(raw_odds, bool) or not math.isfinite(odds) or odds <= 1:
                      discarded.append({"match_id": rec.get("match_id"), "reason": "sin_cuota_valida", "score": score})
                      continue
                  if score < min_score:'''),
          ('''def ensure_auto_pick_from_recommendation(rec):
              rec = dict(rec or {})
              match_id = str(rec.get("match_id") or "").strip()
              selection = str(rec.get("selection") or "").strip()
              odds = as_float(rec.get("odds_value") or rec.get("odds"), 0.0)''', '''def ensure_auto_pick_from_recommendation(rec):
              rec = dict(rec or {})
              # Defense in depth: a cosmetic score must never override WAIT/NO_BET.
              # This boundary is necessary, not proof that a statistical model is validated.
              if rec.get("can_publish") is not True or rec.get("decision") != "BET":
                  return {"ok": False, "created": False, "reason": "analisis_no_publicable"}
              raw_odds = rec.get("odds_value")
              if raw_odds in (None, ""):
                  raw_odds = rec.get("odds")
              odds = as_float(raw_odds, 0.0)
              if isinstance(raw_odds, bool) or not math.isfinite(odds) or odds <= 1:
                  return {"ok": False, "created": False, "reason": "sin_cuota_valida"}
              match_id = str(rec.get("match_id") or "").strip()
              selection = str(rec.get("selection") or "").strip()'''),
          ('''    if not published:
                  actions.append("Generar recomendaciones automáticas y convertir las mejores en picks publicados.")''', '''    if not published:
                  if recommendations and not any(r.get("can_publish") is True and r.get("decision") == "BET" for r in recommendations):
                      actions.append("Hay partidos en análisis, pero no una recomendación de apuesta aprobada. Completar evidencia y validar el modelo; añadir cuotas o bajar el umbral no basta.")
                  else:
                      actions.append("Revisar evidencia, modelo y cuotas vigentes de los candidatos antes de publicar picks.")''')])
          edit('templates/admin_sports_data_picks.html','8db5b64709ca698aa440ade5f046e721864019662b8b2b63666219809eb23808','1946c6c927f5240808d5a88f2220aff36fa676006534601effa815052233d582',[
          ('''      <div class="pick-score"><strong>{{ r.score }}/100</strong><span>{{ r.risk }} · {{ r.membership_required }}</span></div>''', '''      <div class="pick-score"><strong>{{ ui(r.value_label or 'Esperar') }}</strong><span>{{ r.membership_required }}</span><small>{{ ui('Análisis sin apuesta aprobada') if not r.can_publish else ui('Revisar evidencia antes de publicar') }}</small></div>''')])
          PY
      - name: Install isolated test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Publication boundary and postmatch integration regressions
        run: |
          mkdir -p /tmp/prediction-boundary-evidence
          python -c 'import app; app.init_db()'
          python -m pytest -o addopts='' -q tests/test_auto_pick_publication_guard.py --junitxml=/tmp/prediction-boundary-evidence/publication.xml
          python -m pytest -o addopts='' -q tests/test_postmatch_recovery.py tests/test_highlight_review_flow.py tests/test_highlights_admin_review_activation.py tests/test_sports_media_rights_convergence.py tests/test_sports_knowledge_media_experience.py tests/test_sportsdb_dedupe_read_budget.py tests/test_sportsdb_provider_identity_regression.py tests/test_v944_match_center_foundation.py tests/test_match_context_intelligence_continuation.py tests/test_sports_core_match_center_intelligence.py tests/test_design02_reference_conformance.py tests/test_render_cron_master_tick.py tests/test_active_cron_header_transport_v941.py tests/test_render_cron_data_backup.py --junitxml=/tmp/prediction-boundary-evidence/postmatch.xml
          python tools/check_madrid_times.py
          python -m py_compile app.py
          python - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          for name,total in [('publication',21),('postmatch',195)]:
              cases=ET.parse('/tmp/prediction-boundary-evidence/'+name+'.xml').findall('.//testcase')
              assert len(cases)==total
              assert all(c.find(t) is None for c in cases for t in ('skipped','failure','error'))
          PY
      - name: Commit only the verified product files to this feature branch
        run: |
          test "$GITHUB_REF" = refs/heads/feat/own-predictions-evidence-20261001
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py templates/admin_sports_data_picks.html
          git -c core.whitespace=blank-at-eol,blank-at-eof,space-before-tab,cr-at-eol diff --cached --check
          git commit -m 'Fix: respetar bloqueo de publicación y rechazar cuotas no finitas'
          git push origin HEAD:refs/heads/feat/own-predictions-evidence-20261001
          git rev-parse HEAD > /tmp/prediction-boundary-evidence/source-commit.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: prediction-publication-boundary-${{ github.run_id }}
          path: /tmp/prediction-boundary-evidence/
          if-no-files-found: warn
          retention-days: 7
