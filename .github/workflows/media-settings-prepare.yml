name: Prepare verified Premium screen integration
on:
  push:
    branches: [fix/highlights-read-consumers-recovery-20261001]
    paths: [.github/workflows/media-settings-prepare.yml]
permissions:
  contents: write
concurrency:
  group: premium-screen-integration-137
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/fix/highlights-read-consumers-recovery-20261001'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DB_PATH: /tmp/media-settings-qa/app.sqlite
      SECRET_KEY: isolated-media-settings-only
      AUTOMATION_SECRET: isolated-media-settings-cron-only
      BACKGROUND_JOBS_ENABLED: 'false'
      AUTO_GENERATE_PICKS: 'false'
      AUTO_SEND_TELEGRAM_PICKS: 'false'
      SCHEDULER_ENABLED: '0'
      ENABLE_AUTO_SYNC: '0'
      AUTO_SYNC_ON_STARTUP: '0'
      THESPORTSDB_KEY: ''
      THESPORTSDB_API_KEY: ''
      API_FOOTBALL_KEY: ''
      API_FOOTBALL_API_KEY: ''
      THE_ODDS_API_KEY: ''
      OPENAI_API_KEY: ''
      TELEGRAM_BOT_TOKEN: ''
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 40
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11.9'
      - name: Complete source-hashed repair, combine pinned Premium changes, keep guards
        run: |
          mkdir -p /tmp/media-settings-evidence
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python - <<'PY'
          from pathlib import Path
          import hashlib, subprocess, textwrap
          previous = subprocess.check_output(['git','show','db50db8740324fd448f493e0b33403ed00a39d8a:.github/workflows/media-settings-prepare.yml']).decode()
          script = textwrap.dedent(previous.split("          python - <<'PY'\n",1)[1].split('\n          PY',1)[0])
          # The four product patches passed their hashes in the previous run.
          # Its later failure was solely the separately generated workflow hash.
          script = script.split("p='.github/workflows/postmatch-workers.yml';raw=load(p)",1)[0]
          assert '73d911732729812e8b52c3182d4bbdbf9c7aada3902bf38fe7c9122b480dbcee' in script
          compile(script,'reviewed_settings_repair','exec')
          exec(script, {})
          PY
          git add app.py blueprints/admin_master_control.py tests/test_highlight_http_cold_read.py tests/test_highlight_read_consumer_recovery.py
          git commit -m 'Fix: aplicar lectura de ajustes verificable sin confundir errores con pausa'
          git fetch --no-tags --depth=40 origin 15f8b917a3aa3da8b2f478a8caab5264362d0d53
          git merge --no-ff -m 'Integrate Premium collection and read-only screens for unified validation' 15f8b917a3aa3da8b2f478a8caab5264362d0d53
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, re
          p=Path('tests/test_sports_truth_single_source.py');raw=p.read_bytes()
          anchor=b'    monkeypatch.setattr(app_module, "SPORTSDB_FEED_LEAGUES", [], raising=False)'
          assert raw.count(anchor)==1
          raw=raw.replace(anchor,b'    monkeypatch.setattr(app_module, "thesportsdb_key", lambda: "isolated-premium-test-key")\n'+anchor,1)
          compile(raw,str(p),'exec');p.write_bytes(raw)
          p=Path('.github/workflows/postmatch-workers.yml');raw=p.read_bytes()
          assert hashlib.sha256(raw).hexdigest()=='2fb59699f7154074858202c08dd26da0f8932e6661d08da72aee9cf04c4c2c52'
          names=['test_highlight_settings_read_truth','test_highlight_http_cold_read','test_highlight_read_consumer_recovery','test_highlight_catalogue_read_truth','test_highlight_read_diagnostic','test_sportsdb_premium_efficiency','test_sports_truth_single_source']
          anchor=b'            tests/test_postmatch_recovery.py '+bytes([92])+b'\n'
          assert raw.count(anchor)==1
          raw=raw.replace(anchor,b''.join(b'            tests/'+n.encode()+b'.py '+bytes([92])+b'\n' for n in names)+anchor,1)
          anchor=b"          assert len(cases) >= 195, 'Incomplete recovery regression matrix'"
          assert raw.count(anchor)==1
          replacement=b"          assert len(cases) >= 348, 'Incomplete recovery regression matrix'\n          for module, minimum in [('test_highlight_settings_read_truth',26),('test_highlight_http_cold_read',39),('test_sportsdb_premium_efficiency',41)]:\n              assert sum(module in case.get('classname','') for case in cases) >= minimum, module"
          p.write_bytes(raw.replace(anchor,replacement,1))
          # This one-shot preparer is removed in the only published product commit.
          Path('.github/workflows/media-settings-prepare.yml').unlink()
          names=['app.py','blueprints/admin_master_control.py','engines/sportsdb_highlights_engine.py','engines/sportsdb_request_budget.py','engines/postmatch_sources.py','engines/postmatch_recovery.py']
          Path('/tmp/media-settings-evidence/source-hashes.json').write_text(json.dumps({n:hashlib.sha256(Path(n).read_bytes()).hexdigest() for n in names},indent=2))
          PY
          git add .github/workflows/postmatch-workers.yml .github/workflows/media-settings-prepare.yml tests/test_sports_truth_single_source.py
          git -c core.whitespace=blank-at-eol,blank-at-eof,space-before-tab,cr-at-eol diff --cached --check
          git commit -m 'Test combined screen delivery including real settings reads and configured-provider fixture'
      - name: Install isolated test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Verify combined regressions with external transport forbidden
        run: |
          python - <<'PY'
          import socket, pytest, re
          from pathlib import Path
          from xml.etree import ElementTree as ET
          calls=[];original=socket.socket.connect
          def guard(self,address):
              if isinstance(address,tuple) and address[0] not in {'127.0.0.1','localhost','::1'}:
                  calls.append(1);raise AssertionError('External transport forbidden')
              return original(self,address)
          socket.socket.connect=guard
          import app
          app.init_db()
          text=Path('.github/workflows/postmatch-workers.yml').read_text()
          files=list(dict.fromkeys(re.findall(r'tests/test_[a-z0-9_]+\.py',text)))
          result=pytest.main(['-o','addopts=','-q',*files,'--junitxml=/tmp/media-settings-evidence/results.xml'])
          assert not calls
          if result:raise SystemExit(result)
          cases=ET.parse('/tmp/media-settings-evidence/results.xml').findall('.//testcase')
          assert len(cases)>=348
          assert all(c.find(t) is None for c in cases for t in ('failure','error','skipped'))
          for module,minimum in [('test_highlight_settings_read_truth',26),('test_highlight_http_cold_read',39),('test_sportsdb_premium_efficiency',41)]:
              assert sum(module in c.get('classname','') for c in cases)>=minimum
          for name in app.app.jinja_env.list_templates():app.app.jinja_env.parse(app.app.jinja_env.loader.get_source(app.app.jinja_env,name)[0])
          print('Combined executed cases:',len(cases))
          PY
          python -m py_compile app.py blueprints/admin_master_control.py
          python tools/check_madrid_times.py
      - name: Publish only to the existing PR branch if it has not moved
        run: |
          branch=fix/highlights-read-consumers-recovery-20261001
          tip=$(git ls-remote origin refs/heads/$branch | cut -f1)
          test "$tip" = "$GITHUB_SHA"
          test ! -e .github/workflows/media-settings-prepare.yml
          git push origin HEAD:refs/heads/$branch
          git rev-parse HEAD > /tmp/media-settings-evidence/source-commit.txt
          git diff --stat 1690df66d3a114df36f9d93df3cb2e2230023afc HEAD > /tmp/media-settings-evidence/diff-stat.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: combined-premium-screen-${{ github.run_id }}
          path: /tmp/media-settings-evidence/
          retention-days: 7
          if-no-files-found: warn
