name: Prepare verified Premium screen integration
on:
  push:
    branches: [fix/highlights-read-consumers-recovery-20261001]
    paths: [.github/workflows/media-settings-prepare.yml]
permissions:
  contents: write
concurrency:
  group: premium-screen-integration-137
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/fix/highlights-read-consumers-recovery-20261001'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DB_PATH: /tmp/media-settings-qa/app.sqlite
      SECRET_KEY: isolated-media-settings-only
      AUTOMATION_SECRET: isolated-media-settings-cron-only
      BACKGROUND_JOBS_ENABLED: 'false'
      AUTO_GENERATE_PICKS: 'false'
      AUTO_SEND_TELEGRAM_PICKS: 'false'
      SCHEDULER_ENABLED: '0'
      ENABLE_AUTO_SYNC: '0'
      AUTO_SYNC_ON_STARTUP: '0'
      THESPORTSDB_KEY: ''
      THESPORTSDB_API_KEY: ''
      API_FOOTBALL_KEY: ''
      API_FOOTBALL_API_KEY: ''
      THE_ODDS_API_KEY: ''
      OPENAI_API_KEY: ''
      TELEGRAM_BOT_TOKEN: ''
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 40
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11.9'
      - name: Reproduce the already verified source combination without changing main
        run: |
          python - <<'PY'
          import subprocess,textwrap
          text=subprocess.check_output(['git','show','85e15e7f6a1c6322a8d910734774629ba384e2b1:.github/workflows/media-settings-prepare.yml']).decode()
          start=text.index('          mkdir -p /tmp/media-settings-evidence')
          stop=text.index('      - name: Install isolated test dependencies',start)
          subprocess.run(['bash','-e','-c',textwrap.dedent(text[start:stop])],check=True)
          from pathlib import Path
          import json
          names=['.github/workflows/postmatch-workers.yml','.github/workflows/sportsdb-premium-qa.yml']
          Path('/tmp/media-settings-evidence/workflow-updates.json').write_text(json.dumps({name:Path(name).read_text() for name in names},ensure_ascii=False))
          PY
      - name: Install isolated dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Repeat all combined regression cases with external transport forbidden
        run: |
          python - <<'PY'
          import subprocess,textwrap
          text=subprocess.check_output(['git','show','85e15e7f6a1c6322a8d910734774629ba384e2b1:.github/workflows/media-settings-prepare.yml']).decode()
          start=text.index("          python - <<'PY'",text.index('      - name: Verify combined regressions'))
          stop=text.index('      - name: Publish only',start)
          subprocess.run(['bash','-e','-c',textwrap.dedent(text[start:stop])],check=True)
          PY
      - name: Publish source only; never try workflow writes with this token
        run: |
          branch=fix/highlights-read-consumers-recovery-20261001
          tip=$(git ls-remote origin refs/heads/$branch | cut -f1)
          test "$tip" = "$GITHUB_SHA"
          git restore --source="$GITHUB_SHA" --staged --worktree .github/workflows
          tree=$(git write-tree)
          commit=$(printf '%s\n' 'Fix: verified combined Premium collectors and real-screen readers, no workflow writes' | git commit-tree "$tree" -p "$GITHUB_SHA")
          git diff --exit-code "$GITHUB_SHA" "$commit" -- .github/workflows
          git push origin "$commit":refs/heads/$branch
          printf '%s\n' "$commit" > /tmp/media-settings-evidence/source-commit.txt
          git diff --stat 1690df66d3a114df36f9d93df3cb2e2230023afc "$commit" > /tmp/media-settings-evidence/diff-stat.txt
          printf '%s\n' "$tree" > /tmp/media-settings-evidence/tree-sha.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: combined-premium-screen-${{ github.run_id }}
          path: /tmp/media-settings-evidence/
          retention-days: 7
          if-no-files-found: warn
