name: Prepare exact postmatch candidate
on:
  push:
    branches: [feat/postmatch-highlights-statistics-workers-20261001]
    paths: [.github/workflows/postmatch-prepare.yml]
permissions:
  contents: write
jobs:
  prepare:
    if: github.ref == 'refs/heads/feat/postmatch-highlights-statistics-workers-20261001'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DB_PATH: /tmp/postmatch-candidate/app.sqlite
      SECRET_KEY: postmatch-ci-only
      AUTOMATION_SECRET: postmatch-ci-only
      BACKGROUND_JOBS_ENABLED: 'false'
      AUTO_GENERATE_PICKS: 'false'
      AUTO_SEND_TELEGRAM_PICKS: 'false'
      SCHEDULER_ENABLED: '0'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/postmatch-highlights-statistics-workers-20261001
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11.9'
      - name: Verify source hashes and apply only reviewed integration
        run: |
          python - <<'PY'
          import base64,hashlib,json,pathlib,subprocess,zlib
          before={"app.py":"ea6b3f702253438feda2d03156fda8f01cbf84c470f1b79b00057e2b3301467d","blueprints/architecture.py":"481111f317b2da88820abeab81aaed9faf9e3fa0babd8a2a020af3c59881e2d5","blueprints/media_review.py":"e7bbf7c45f7239684416a5b81fa05a4cce5be0f01435bb6fe9f89d32e8f551ba","engines/match_context_engine.py":"510119875848e77ff97c8921223eb5eb07c5bc9914a6226c93ba42a27f8a4757","engines/sportsdb_highlights_engine.py":"9adfe8339a0bd54e529c06c4537916859f8c788d31330bbecb087184e8e3109e","templates/admin_highlights_review.html":"351748035e18a460353f7334101c0222928b93d5d237e8ae74361eb1cc2c1e5d","templates/components/v944_match_center.html":"c09986446288e1ecc23101d007adde6d60bba1c3b6ef7869bf8d4befcb0631ad","templates/match_detail.html":"93cbdd2980b8bd75f933374862a0f15d4585275bf7132bd28517394873e3f2a6","tests/test_render_cron_master_tick.py":"3afbac9fff3e4e8e8e4ba251ce11ac4174a961c4f492df8a648493e5b046bfa8","tools/render_cron_highlights_sync.py":"facff7afe329a7406ea204ce73f235c1c52e6138292c84de0ec8c33fc7687f20","tools/render_cron_master_tick.py":"6f0be792b74fa862d7afa9cee3774d897d40ceaf14d0da1747ed53418c1a6751"}
          after={"app.py":"9c59f16603ed4c9a0950f7f5b7f697869090c24c4b1bc03ed488ea504693cda2","blueprints/architecture.py":"743c0d8033072766347617458635c604c561085f74b226bae2aced81f9c34e77","blueprints/media_review.py":"0276c878c27cf45aed41a9b9b45541a3f9c20136d701435a582e3ea11bf47eff","engines/match_context_engine.py":"21c68891716ef25cb77df456cdc97a1e1bc4ca9c246ae2dcf6b6cea216b53776","engines/sportsdb_highlights_engine.py":"824cca2ae0b1290616f675aa5064001e62f6e23f9d734a1d4eb4bbd3225bf8e3","templates/admin_highlights_review.html":"3edd2bbe723b923dab2d6e5237e4a3fb47e626790ddd9b67948c80fd21775417","templates/components/v944_match_center.html":"050189a3bb6412ae62b5f9dcdce9a64f5e62927bafb6d6c6685e04ca11342680","templates/match_detail.html":"8f2bbae6c6f96d38ac3ac2da5b86a76cd91997858dd71db09e43f8d069477f62","tests/test_render_cron_master_tick.py":"1d7f76e1fd053812fbd024d1835290342d581d2485e0b41ace347c7c9707c88b","tools/render_cron_highlights_sync.py":"82b5c04fa8ad9fc278112722e930d4d1f194bc911e79fdb3163100cfc5d1f334","tools/render_cron_master_tick.py":"b6f6f442c73d7bef1e4ad5058af6f0d0994d5433080789ff10a48bd7a2864da0","blueprints/postmatch_recovery.py":"5c706e30d30ad74f06590741853d1943757100ac5852ac49187e958f48f26300","engines/postmatch_store.py":"0e086ddfeeac85435b379751e97a7820aee71458e2df188c1f5b53ba1614bb86","engines/postmatch_sources.py":"ac92905d44fa22f2b5021565bf9ae1f5d19f5064daf0f7a1bfb05a1a43fb3f32","engines/postmatch_recovery.py":"1533aa46fa58a0df55b5444625a3809966756bdc7efb04c1544f4fbea1a00b35","static/postmatch-media.js":"c56667f0ab2ab8ed32aee2145b4e05963c694529cbb60368a57a7dc25cae63e3","templates/partials/postmatch_workers.html":"033f98e54ce86c33b866d93098e4230dc98d7b37d73c76265ceeb83e448edcd4","tests/test_postmatch_recovery.py":"afff4de594cdf0f2d8f420c14413c639104d7b993f483b382a19fb7c388c8bb4","tools/run_postmatch_browser_qa.py":"e76def9ca40796abcd0bb3bf8bfbfc09c812a976576568bfdc081c4c9eaedcb4","docs/POSTMATCH_RECOVERY.md":"685f65373543669f997168df254600abf8861d5060685776e354ab3f40d0c38f"}
          def check(name,digest):
              assert hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest()==digest, 'SOURCE_HASH_MISMATCH:'+name
          for name,digest in before.items(): check(name,digest)
          for name,digest in after.items():
              if name not in before: check(name,digest)
          data=''
          patch=zlib.decompress(base64.b64decode(data))
          assert hashlib.sha256(patch).hexdigest()=='d7379a501f94a425be7cd991488ccbed7b5ed304b4c4397719c0829c62735145'
          subprocess.run(['git','apply','--check','--unidiff-zero'],input=patch,check=True)
          subprocess.run(['git','apply','--unidiff-zero'],input=patch,check=True)
          for name,digest in after.items(): check(name,digest)
          pathlib.Path('/tmp/postmatch-expected.json').write_text(json.dumps(after))
          pathlib.Path('/tmp/postmatch-paths.txt').write_text('\n'.join(before))
          print('EXACT_SOURCE_VERIFIED',len(after))
          PY
      - name: Install isolated dependencies
        run: |
          python -m pip install -r requirements-dev.txt -r browser_qa/playwright_requirements.txt
          python -m playwright install --with-deps chromium
          mkdir -p /tmp/postmatch-candidate
          python -c 'import app; app.init_db()'
      - name: Run isolated recovery regressions
        run: |
          python -m pytest -o addopts='' -q tests/test_postmatch_recovery.py tests/test_highlight_review_flow.py tests/test_highlights_admin_review_activation.py tests/test_sports_media_rights_convergence.py tests/test_sports_knowledge_media_experience.py tests/test_sportsdb_dedupe_read_budget.py tests/test_sportsdb_provider_identity_regression.py tests/test_v944_match_center_foundation.py tests/test_match_context_intelligence_continuation.py tests/test_sports_core_match_center_intelligence.py tests/test_design02_reference_conformance.py tests/test_render_cron_master_tick.py tests/test_active_cron_header_transport_v941.py tests/test_render_cron_data_backup.py --junitxml=reports/postmatch_preparation/results.xml
          python tools/check_madrid_times.py
      - name: Full HTTP browser check without external providers
        run: python tools/run_postmatch_browser_qa.py --output reports/postmatch_preparation/browser
      - name: Commit only the verified integration to the isolated branch
        run: |
          test "$GITHUB_REF" = refs/heads/feat/postmatch-highlights-statistics-workers-20261001
          python - <<'PY'
          import json,hashlib,pathlib,subprocess
          for name,digest in json.loads(pathlib.Path('/tmp/postmatch-expected.json').read_text()).items():
              assert hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest()==digest,name
          subprocess.run(['git','add','--']+pathlib.Path('/tmp/postmatch-paths.txt').read_text().splitlines(),check=True)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -c core.whitespace=blank-at-eol,blank-at-eof,space-before-tab,cr-at-eol diff --cached --check
          git commit -m 'Feat: integrar trabajadores pospartido, vídeo y estadísticas con pruebas'
          git push origin HEAD:refs/heads/feat/postmatch-highlights-statistics-workers-20261001
          git rev-parse HEAD > reports/postmatch_preparation/source-commit.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: postmatch-preparation-${{ github.run_id }}
          path: reports/postmatch_preparation/
          if-no-files-found: warn
          retention-days: 7
