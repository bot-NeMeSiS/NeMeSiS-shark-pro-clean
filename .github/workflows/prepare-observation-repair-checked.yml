name: Prepare checked observation repair
on:
  push:
    branches: [chatgpt/observation-clock-repair-20260921]
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'bot-NeMeSiS/NeMeSiS-shark-pro-clean' && contains(github.event.head_commit.message, '[checked-observation-repair]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/observation-clock-repair-20260921
      - name: Apply exact-hash candidate after transport validation
        run: |
          python - <<'PY'
          import pathlib, subprocess, textwrap
          source = pathlib.Path('.github/workflows/prepare-observation-repair.yml').read_text()
          assert source.count('WWqxZZ9') == 1
          source = source.replace('WWqxZZ9', 'WWqxZ9')
          command = textwrap.dedent(source.split('        run: |\n', 1)[1])
          subprocess.run(['bash', '-e', '-c', command], check=True)
          PY
