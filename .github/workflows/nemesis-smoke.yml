name: NeMeSiS Smoke Checks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install -r browser_qa/playwright_requirements.txt
      - name: Install test browser
        run: python -m playwright install --with-deps chromium
      - name: Crest fallback browser regression (offline)
        run: python tools/check_crest_fallback_browser.py --output-dir /tmp/nemesis-crest-qa
      - name: Run smoke check
        env:
          SECRET_KEY: test-secret-key-for-ci
          ADMIN_EMAIL: admin@example.com
          ADMIN_PASSWORD: admin-password
          BACKGROUND_JOBS_ENABLED: 'false'
          AUTO_GENERATE_PICKS: 'false'
          AUTO_SEND_TELEGRAM_PICKS: 'false'
          DB_PATH: /tmp/nemesis_ci.db
        run: python tools/smoke_check.py
      - name: Run tests
        env:
          SECRET_KEY: test-secret-key-for-ci
          ADMIN_EMAIL: admin@example.com
          ADMIN_PASSWORD: admin-password
          BACKGROUND_JOBS_ENABLED: 'false'
          AUTO_GENERATE_PICKS: 'false'
          AUTO_SEND_TELEGRAM_PICKS: 'false'
          DB_PATH: /tmp/nemesis_ci.db
        run: |
          pytest \
            --ignore-glob='tests/test_local_*.py' \
            --ignore=tests/test_project_control_http.py \
            --ignore=tests/test_sentinel_jobs_http.py \
            --ignore=tests/test_sentinel_operational_browser.py
          NEMESIS_LOCAL_SAFE_MODE=1 \
          NEMESIS_LOCAL_MODE=OFFLINE_SAFE \
          NEMESIS_OFFLINE_MODE=1 \
          NEMESIS_LOCAL_EXTERNAL_AUTHORIZED=0 \
          NEMESIS_LOCAL_ACCESS_TOKEN=ci-local-safe-token \
          SESSION_COOKIE_SECURE=0 \
            pytest tests/test_local_*.py
          pytest tests/test_project_control_http.py
          pytest tests/test_sentinel_jobs_http.py
          pytest tests/test_sentinel_operational_browser.py
