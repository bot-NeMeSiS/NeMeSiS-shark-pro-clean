<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>NeMeSiS SHARK PRO</title>
  <desc>App icon master. The existing atmospheric shark is reused without changing its geometry.</desc>
  <defs>
    <radialGradient id="ocean" cx=".35" cy=".3" r=".82">
      <stop stop-color="#0b4766"/>
      <stop offset=".38" stop-color="#07233a"/>
      <stop offset=".78" stop-color="#020c18"/>
      <stop offset="1" stop-color="#010710"/>
    </radialGradient>
    <radialGradient id="light" cx=".37" cy=".25" r=".64">
      <stop stop-color="#32d1f4" stop-opacity=".21"/>
      <stop offset=".6" stop-color="#0e75b5" stop-opacity=".06"/>
      <stop offset="1" stop-color="#020c18" stop-opacity="0"/>
    </radialGradient>
    <filter id="icon-light" x="-15%" y="-20%" width="130%" height="140%" color-interpolation-filters="sRGB">
      <feComponentTransfer>
        <feFuncR type="gamma" amplitude="1.25" exponent=".8" offset="0"/>
        <feFuncG type="gamma" amplitude="1.25" exponent=".55" offset=".02"/>
        <feFuncB type="gamma" amplitude="1.3" exponent=".6" offset=".02"/>
      </feComponentTransfer>
    </filter>
    <filter id="icon-silhouette" color-interpolation-filters="sRGB">
      <feComponentTransfer>
        <feFuncR type="linear" slope="0" intercept=".25"/>
        <feFuncG type="linear" slope="0" intercept=".82"/>
        <feFuncB type="linear" slope="0" intercept=".97"/>
        <feFuncA type="gamma" amplitude="1" exponent="3" offset="0"/>
      </feComponentTransfer>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#ocean)"/>
  <rect width="1024" height="1024" fill="url(#light)"/>
  <g id="shark" transform="rotate(-22 512 512)" filter="url(#icon-light)">
    <image id="identity-source" x="42" y="250" width="940" height="524" xlink:href="../nemesis-shark-atmosphere-v2.webp"/>
  </g>
</svg>
