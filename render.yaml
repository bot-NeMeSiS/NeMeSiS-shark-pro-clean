services:
  - type: web
    name: nemesis-shark-pro
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 3 --worker-class gthread --timeout 90
    envVars:
      - key: DB_PATH
        value: /data/database.db
      - key: PYTHON_VERSION
        value: 3.11.9
