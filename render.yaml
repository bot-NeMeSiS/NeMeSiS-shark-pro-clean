services:
  - type: web
    name: nemesissharkpro
    runtime: python
    region: oregon
    plan: starter
    branch: main
    autoDeployTrigger: commit
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    healthCheckPath: /api/health
    disk:
      name: disk
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DB_PATH
        value: /data/database.db
      - key: CONTINUOUS_EVOLUTION_SAFE_MODE
        value: "1"
      - key: CONTINUOUS_EVOLUTION_STORAGE_ROOT
        value: /data/continuous_evolution_os
      - key: AUTOMATION_SECRET
        sync: false
      - key: SCHEDULER_ENABLED
        value: "0"
      - key: ENABLE_AUTO_SYNC
        value: "0"
      - key: AUTO_SYNC_ON_STARTUP
        value: "0"
      - key: DAILY_AUTOMATION_ENABLED
        value: "0"
      - key: DATA_BACKUP_ENABLED
        value: "1"

  - type: cron
    name: telegram-auto-tick
    runtime: python
    region: oregon
    plan: starter
    branch: main
    autoDeployTrigger: commit
    schedule: "*/10 * * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python tools/render_cron_master_tick.py
    envVars:
      - key: PUBLIC_BASE_URL
        value: https://bot-apuestas-crgf.onrender.com
      - key: AUTOMATION_SECRET
        sync: false
